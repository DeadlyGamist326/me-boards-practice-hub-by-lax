<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEBP TO PNG</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1c1c1c; --muted:#6b6b6b; --line:#d9d6cf; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --card:#222; --text:#eee; --muted:#9a9a9a; --line:#3a3a3a; --accent:#60a5fa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  #drop { border:2px dashed var(--line); border-radius:12px; background:var(--card); padding:28px 16px; text-align:center; cursor:pointer; outline:none; }
  #drop:focus, #drop.over { border-color:var(--accent); }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0; }
  button { font:inherit; padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #msg { color:var(--muted); font-size:14px; }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
  .it { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px; font-size:12px; overflow-wrap:anywhere; }
  .it img { width:100%; height:90px; object-fit:contain; display:block; margin-bottom:4px; }
</style>
</head>
<body>
<main>
  <h1>WEBP TO PNG</h1>
  <p class="sub">Choose or drop many .webp images. They convert in your browser (nothing is uploaded) and download as one zip.</p>
  <div id="drop" tabindex="0" role="button">Click or drop images here</div>
  <input id="f" type="file" accept="image/*" multiple hidden>
  <div class="bar">
    <button id="go" class="primary" disabled>Convert and download zip</button>
    <button id="clr" disabled>Clear</button>
    <span id="msg" role="status"></span>
  </div>
  <div id="list"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let files = [];
const $ = id => document.getElementById(id);
const drop = $('drop'), f = $('f'), go = $('go'), clr = $('clr'), list = $('list'), msg = $('msg');
function render() {
  list.innerHTML = '';
  files.forEach(x => {
    const d = document.createElement('div'); d.className = 'it';
    const im = document.createElement('img'); im.src = URL.createObjectURL(x); im.onload = () => URL.revokeObjectURL(im.src);
    const t = document.createElement('div'); t.textContent = x.name;
    d.append(im, t); list.appendChild(d);
  });
  go.disabled = clr.disabled = !files.length;
  msg.textContent = files.length ? files.length + ' image(s) ready.' : '';
}
function add(fl) { files = files.concat([...fl].filter(x => x.type.startsWith('image/'))); render(); }
drop.onclick = () => f.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f.click(); } };
f.onchange = () => { add(f.files); f.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
clr.onclick = () => { files = []; render(); };
function toPng(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(new Error(file.name)); }, 'image/png');
    };
    img.onerror = () => rej(new Error(file.name));
    img.src = u;
  });
}
go.onclick = async () => {
  go.disabled = true;
  const z = new JSZip(), used = {}, bad = []; let i = 0;
  for (const x of files) {
    let n = x.name.replace(/\.[^.]+$/, ''); used[n] = (used[n] || 0) + 1; if (used[n] > 1) n += '-' + used[n];
    try { z.file(n + '.png', await toPng(x)); } catch (e) { bad.push(x.name); }
    msg.textContent = 'Converting ' + (++i) + ' of ' + files.length + '...';
  }
  if (bad.length === files.length) { msg.textContent = 'None of the files could be converted.'; go.disabled = false; return; }
  const blob = await z.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'converted-png.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  msg.textContent = 'Done. ' + (files.length - bad.length) + ' converted' + (bad.length ? ', skipped: ' + bad.join(', ') : '') + '.';
  go.disabled = false;
};
</script>
</body>
</html>
