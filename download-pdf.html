<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF DOWNLOADER</title>
<style>
  :root { --bg: #f6f5f2; --text: #1c1c1c; --muted: #8a8a8a; --ok: #1f9d55; --warn: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --text: #eeeeee; --muted: #8a8a8a; --ok: #4ade80; --warn: #fb923c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; cursor: pointer; user-select: none;
  }
  h1 { font-size: 22px; letter-spacing: 0.08em; margin: 0 0 28px; color: var(--muted); }
  #status { font-size: clamp(48px, 14vw, 120px); font-weight: 800; letter-spacing: 0.04em; margin: 0; transition: color .2s; }
  #status.ok { color: var(--ok); }
  #status.fail { color: var(--warn); font-size: clamp(22px, 5vw, 32px); }
  #hint { margin-top: 18px; font-size: 14px; color: var(--muted); min-height: 1.2em; }
  #how { display: none; margin: 22px auto 0; max-width: 460px; text-align: left; font-size: 15px; line-height: 1.5; }
  #how.show { display: block; }
  #how b { color: var(--ok); }
</style>
</head>
<body>
<h1>PDF DOWNLOADER</h1>
<p id="status">COPYING...</p>
<div id="hint"></div>
<ol id="how">
  <li>Open the PDF in <b>Google Drive</b> (the preview) and scroll down so every page has loaded.</li>
  <li>Press <b>F12</b> and open the <b>Console</b> tab.</li>
  <li>Paste with <b>Ctrl+V</b> and press <b>Enter</b> (type <b>allow pasting</b> first if the browser asks).</li>
  <li>The PDF downloads with the same name as the tab.</li>
</ol>

<script type="text/plain" id="code">(async function () {
    let trustedURL;
    if (window.trustedTypes && trustedTypes.createPolicy) {
        const policy = trustedTypes.createPolicy("myPolicy", {
            createScriptURL: (input) => input
        });
        trustedURL = policy.createScriptURL(
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
        );
    } else {
        console.warn("Trusted Types are not supported in this browser. Falling back to a plain URL.");
        trustedURL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    }

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }

    function getFileNameFromTab() {
        let name = (document.title || "download")
            .replace(/\s*-\s*Google Drive\s*$/i, "")
            .replace(/\.pdf\s*$/i, "")
            .replace(/[\\/:*?"<>|]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .substring(0, 150);

        return (name || "download") + ".pdf";
    }

    await loadScript(trustedURL);

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
        orientation: "p",
        unit: "mm",
        format: "a4",
        compress: true
    });

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();

    const images = Array.from(document.querySelectorAll("img"))
        .filter(img => /^blob:/.test(img.src));

    if (images.length === 0) {
        console.warn("No blob images found on this page.");
        return;
    }

    for (let index = 0; index < images.length; index++) {
        const img = images[index];

        if (!img.complete) {
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
            });
        }

        const sourceWidth = img.naturalWidth || img.width;
        const sourceHeight = img.naturalHeight || img.height;

        const scale = 2;

        const canvas = document.createElement("canvas");
        canvas.width = sourceWidth * scale;
        canvas.height = sourceHeight * scale;

        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, sourceWidth, sourceHeight);

        const imgData = canvas.toDataURL("image/jpeg", 1.0);

        const ratio = Math.min(pageWidth / sourceWidth, pageHeight / sourceHeight);
        const pdfWidth = sourceWidth * ratio;
        const pdfHeight = sourceHeight * ratio;

        const x = (pageWidth - pdfWidth) / 2;
        const y = (pageHeight - pdfHeight) / 2;

        if (index > 0) {
            pdf.addPage();
        }

        pdf.addImage(imgData, "JPEG", x, y, pdfWidth, pdfHeight, undefined, "SLOW");
    }

    pdf.save(getFileNameFromTab());
})();</script>

<script>
  const code = document.getElementById("code").textContent;
  const statusEl = document.getElementById("status");
  const hintEl = document.getElementById("hint");
  const INTERVAL = 15;
  let timer = null;

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function copyCode() {
    statusEl.textContent = "COPYING...";
    statusEl.className = "";
    let ok = false;
    try {
      await navigator.clipboard.writeText(code);
      ok = true;
    } catch (e) {
      ok = fallbackCopy(code);
    }
    if (ok) {
      statusEl.textContent = "COPIED";
      statusEl.className = "ok";
      document.getElementById("how").classList.add("show");
    } else {
      statusEl.textContent = "Click the page to copy";
      statusEl.className = "fail";
    }
    startCountdown();
  }

  function startCountdown() {
    clearInterval(timer);
    let left = INTERVAL;
    hintEl.textContent = "Copying again in " + left + "s";
    timer = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(timer);
        copyCode();
      } else {
        hintEl.textContent = "Copying again in " + left + "s";
      }
    }, 1000);
  }

  document.addEventListener("click", copyCode);
  window.addEventListener("load", copyCode);
</script>
</body>
</html>
