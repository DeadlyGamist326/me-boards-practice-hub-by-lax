  "2026-10-08": {
    stamp: "v1.3.47.0 – v1.3.50.2",
    title: "Math Handout, Sample Problems, Problem Set and Trivia Day 15 and Day 16 (Engineering Sciences)",
    body: [
      "v1.3.48.1: LAX sent 14 definition questions from the Revalida Exam (no answer key, no day given, scope Math Day 1 to 11) to add to the Exam Missed Questions Compilation. Filed each by topic: D1 Factoring, Classical Adjoint; D2 Complex Conjugates; D3 Binomial Theorem; D4 Combination, Stirling's Approximation; D5 Trigonometry, Briggsian Logarithm, Cevian; D6 Solid Mensuration, Spherical Wedge, Euler Line; D10 Integration by Parts; D11 Particular Solution. Each q text ends with \"(From the Revalida Exam)\" and the last hint tier repeats the source; added new topic names to math1/2/3/4/5/6/10/11FormulaOutline so the filter lists them. Answers chosen by me (no key): all unambiguous definitions. Typos fixed from the pasted text: angels to angles, raided to raised, Logarith to Logarithm, a missing \"is\" in the lead-ins. Verification: node --check, no mojibake, 14 questions added.",
      "v1.3.47.0: LAX uploaded the Math Day 15 and Day 16 Handout PDFs (Engineering Sciences, Physics and Mechanics). Activated both: added views view-handout-math-15/16 (they had none, only the blurred home tiles), added 15 and 16 to availableMathHandouts and emptied pendingContentMathHandouts. Sample Problems, Problem Set and Trivia for Days 15-16 stay pending.",
      "Handout 15: I Statics, II Friction (with belt friction), III Motion (rectilinear, free fall, circular, projectile), IV Reverse Effective Force; 11 sample problems built from the PDF problems. Handout 16: I Work, Power and Energy, II Impulse and Momentum, III Centrifugal Force (with banking), IV Specific Heat Capacity, V Thermal Expansion, VI Ohm's Law (series/parallel resistance, inductance); 14 sample problems. All 28 source figures that carry meaning were embedded as base64 JPEG. Long boxes use fb-long (full row); only short formulas sit in grids.",
      "No answer key was supplied, so every problem was solved from scratch and compared with the printed choices; of the 14 problems with printed choices, 13 match one choice (Day 15 Static 3 to rounding); the exception is Day 15 Reverse Effective Force 1 (see below).",
      "Disclosed assumptions/source issues: D15 Friction 1 reads P as horizontal and pushing toward the plane (answer 93.8 kg = W tan 15 deg since f = 0.268 = tan 15 deg). D15 Static 3 gives 268.33 kN (printed choice C 268.32). D15 Reverse Effective Force 1: correct tension is 2383 lbs (whole 2180 lbs accelerated); none of the choices match, D (2366) is what you get by adding the man's 180 lbs without his inertia, flagged on the page. D15 belt friction: the source line 'angle of contact, radians = 2.718' merged theta and e, shown as two variables. D16 Impulse 2 assumes both particles move in the same direction (answer 30.25 J, choice B). D16 Coefficient of restitution is printed without the minus sign; kept as printed and described as a positive ratio. D16 banking: source writes tan(theta+x) = f = a/g; added that f = tan x. D16 Centrifugal 3 reads 'banked to give lateral pressure equivalent to f = 0.18' as tan(theta) = 0.18, answer f = 0.206. D16 Specific Heat 1 reads 'boil down' as vaporizing all of 1.2 kg from 100 C (0.60 hr, choice D). D16 Specific Heat 2 uses 333.7 kJ/kg from the problem (handout says 335). D16 Ohm 3 reads '12 DC' as 12 V. D16 thermal expansion: 't1 = initial length' corrected to initial temperature and 'kV = coefficient of linear expansion' to volume expansion. Added V = IR to the Ohm's Law card (the source states the law only in words). Source headings Thermal Expansion and Ohm's Law had no numerals; numbered V and VI.",
      "Verification: node --check on the script, CSS braces balanced, no mojibake; Playwright with a local MathJax: handout 15 shows 11 sample problems and 11 images, handout 16 shows 14 and 17; no raw LaTeX and no MathJax errors with every hint panel opened; Day 15 and 16 Handout tiles are no longer pending on the home page.",
      "v1.3.48.0: LAX then sent the Day 15 and Day 16 Sample Problems PDFs (image-only PDFs, so read visually; the source diagrams were cropped from the page images). Added views view-samples-math-15/16, added 15 and 16 to availableMathSampleProblems, emptied pendingContentMathSampleProblems, declared math15FormulaOutline / math16FormulaOutline (sections match the Handout h2 headings; unused groups show greyed with 0) and attached the Practice by formula filter. Day 15: 11 problems (Statics 8, Friction 3). Day 16: 11 problems (Impulse and Momentum 10, Work/Energy/Power 1; the PDF stops after that one WEP problem).",
      "Disclosed in the hints or here: D15 #5 printed choice A reads 13.62 m and the solution 13.65 m, but the units are ft (supports 20 ft apart), answer 13.65 ft, A kept. D15 #8 solved by moments about A (source uses B), 34.64 kg vs printed choice D 34.62. D15 #9 source writes W sin45 in the normal-force equation; equal at 45 deg. D15 #10: source gets 0.66 but no printed choice matches (0.35, 0.45, 0.50, 0.58); choice D rewritten to 0.66. D15 #11: the source has no choices and no solution (and prints the number as 9.); solved from scratch, T = 43.1 lb, four choices written by me. D15 #2 reads the 10 in as the rod diameter (per the figure); unit written kPa. D16 #2: the figure shows the particles moving toward each other but the solution and choice C add the velocities (30.25 J); followed the solution, opposite directions would give 20.25 J (not a choice). D16 #6: 3478 lb, source rounds to 3500 (B). D16 #7: the source solution uses 45 for the momentum instead of 15 x 5 = 75 and gets 0.75 m/sec; the correct value is 1.25 m/sec, not among the choices, so choice D rewritten from 1.5 to 1.25.",
      "Also converted plain unit text and numeric fractions in the Handout 15/16 problem text and notes (m/s, km/hr, 3/4 and similar) into standing fractions (new uf() helper in the generator), and the Hp conversion note into a boxed standing-fraction line. Verification: node --check, CSS braces balanced, no mojibake; Playwright with a local MathJax: samples 15 and 16 show 11 problems each with 11 choice sets, 10 figures each, 11 data-topic blocks and a working filter (counts per topic correct), no raw LaTeX or MathJax errors with every hint opened; both Sample Problems tiles are no longer pending on the home page.",
      "v1.3.49.0: LAX then sent the Day 15 and Day 16 Problem Set PDFs (60 and 58 questions, with answer keys). Added views view-ps-15/16, ps15Data/ps16Data (4-tier hints on every question, topics tagged), renderQuiz calls, 15 and 16 added to availableProblemSets and pendingContentProblemSets emptied. Extended math15FormulaOutline (new section V. Weight, Force and Energy Applications, plus the resultant/tension/belt-friction/incline topics under I-III) and math16FormulaOutline (new section VII. Dynamics Review (Day 15 Topics), plus the collision, banking, heat, electricity topics under I-VI); every topic used by the two quizzes is in an outline, so nothing falls to Other.",
      "Every answer was recomputed from scratch and compared with the key (generator warns if the nearest choice differs from the key). Day 15 key conflicts, followed with a Disclosure note in the last hint: #8 (165 lb at 6.55 ft vs key 6 ft), #20, #34, #35, #36, #41; #51 had a garbled printed value (read from the page image, noted in the hint). Day 16: #52 key B 61.05 fps is the flat-curve value sqrt(fgR) = 60.85, while the banked-curve reading (36 mph design speed) gives 81.80 fps (choice A); key followed and both readings shown.",
      "Day 16 smaller notes in the hints: #7 directions not given, same direction assumed (key 55 m/s); #30 220 V x 10 A = 2200 W does not match the 2500 VA, key 88% uses 2200/2500; #32 printed exponent garbled, read as 8 x 10^-4 s because it gives the key's 31.2 kN; #45 key -2,500 N is the net average force (impulse-momentum), the water force would be about 3,457 N; #15 the 15 s is not needed; #56 question asks kW though the opening sentence says horsepower; #21, #23, #37, #43, #47 only differ from the key by rounding of constants.",
      "Verification: node --check on the script, CSS braces balanced, no mojibake; Playwright with a local MathJax: quiz-ps-15 renders 60 questions and quiz-ps-16 58, subtitles correct, filter panels present, no raw LaTeX and no MathJax error nodes with all hints typeset (about 1,100 formulas each). Trivia Day 15/16 followed in v1.3.50.0.",
      "v1.3.50.0: LAX then sent the Trivia Math Day 15 and Day 16 PDFs (15 questions each, answer keys, laid out in 3 columns separated by lines). Read from the page images column by column (the text layer interleaves the columns) and checked the counts: 15 questions with 4 choices each in both, Day 16 Q5's choices sit at the top of the next column. Added view-trivia-15/16, trivia15Data/trivia16Data (4-tier hints, topics), renderQuiz calls, availableTriviaDays 15-16, pendingContentTriviaDays emptied; added the topic Series-Parallel Resistance to math16FormulaOutline VI. This closes Math Day 15 and Day 16 (all four content types).",
      "All 30 answers recomputed and match the key (D15 #6 24.26 vs 24.5, #10 31.8 vs 32, #14 198.9 vs 200 and #15 327.9 vs 330 are rounding, noted in the hints). Disclosures in the hints: D16 #1 the key (3.40 m/s) only works if both bodies move in the same direction, not head-on; D16 #2 choices A and B differ only by a comma/point (2.936 vs 2,936 kJ), A is right; D16 #5 directions not given, same direction used; D16 #6 the answer is a rate (kJ/s); D16 #8 steel alpha not given, 11.7e-6 per C reproduces the key; D16 #11 59.5 kW rounds to 60.",
      "Verification: node --check, CSS braces balanced, no mojibake; Playwright with a local MathJax: quiz-15 and quiz-16 render 15 questions each, filter panel present, no raw LaTeX, no MathJax errors with all hints typeset.",
      "v1.3.50.1: LAX asked why units in the Day 15-16 content were LaTeX and not standing fractions. Cause: my generator wrote unit fractions in the Problem Set and Trivia q:/choices: as { latex: \"\\dfrac{\\text{m}}{\\text{s}}\" } (and \\text{1/°C}, \\text{BTU/lb}_m, a \\frac{1}{3}), but the ruling (in-file section 1) says units with a slash and numeric fractions in questions and choices must be { frac: [num, den] } objects with the NBSP padding formula; {latex:} is only the escape hatch for sqrt, integrals and fractional exponents. Fixed 149 segments (PS15 67, PS16 48, Trivia15 25, Trivia16 24 plus the odd ones: 1 g/cm3, BTU/lbm with a subscript m, 1/°C, 1/3) with a script that applies the padding rule (pad = diff/2 + 1 per side, diff rounded up to even) and writes the exponent as a plain superscript character.",
      "Also fixed plain-text units left in the hints (kw-map phrases and notes: ft/s2, ft/sec2, m/s2, kg/m, kg/L, BTU/lbm, cm/s2, mile/hr, and '10m/s' in Sample Problem 16 #2) and slash units still inside \\text{...} in the PS16 and Trivia hints (kJ/kg·°C, Btu/lb·°F, ft-lb/s, 1/°C, ft/s (key)): all are now stacked \\dfrac in the hint LaTeX. Verified in a browser by scanning every Day 15/16 view (Handouts, Sample Problems, Problem Sets, Trivia) for any remaining letter/letter slash outside MathJax: none; screenshot of Trivia 16 #4 shows km/hr and cm/s2 as stacked fractions. Lesson for next days: use the existing { frac } generator path for q/choices, never {latex} for plain unit ratios.",
      "v1.3.50.2: LAX noticed some answer choices were not clickable (ruling: every choice is clickable, handouts and sample problems included). Cause: in Handout Day 15 and Day 16, the 14 sample problems that print A-D choices had the choices as plain text inside .sp-title (\"A. ... &nbsp; B. ...\") instead of the .sp-choices.sp-choices-boxed data-answer block with .sp-choice spans used by the Sample Problems pages and the older Handouts. Converted all 14 (D15 #3 C, #5 A, #6 A, #9 D, #10 D; D16 #15 C, #16 B, #18 C, #20 D, #21 A, #22 D, #23 D, #24 C, #25 A; the letters are the ones each solution already reached). D15 Reverse Effective Force #10 has no printed choice equal to the computed 2383 lbs, so data-answer is D (2366, the closest and the source's own figure) and the existing note on the page explains it.",
      "Also changed the hint-answer lines that were written \"Answer: \\( C.\\ ... \\)\" (letter inside the math) to \"Answer: C. \\( ... \\)\" in Handouts 15/16 and Sample Problems 15/16, as the ruling says only the formula goes inside the math. Verified in a browser: every choice group in the Day 15/16 Handouts (14), Sample Problems (22), Problem Sets (118) and Trivia (30) changes state when clicked.",
    ]
  },
  "2026-10-07": {
    stamp: "v1.3.45.0 – v1.3.46.0",
    title: "Free trial without sign-up",
    body: [
      "v1.3.46.0: LAX asked for a block-access option. Tracker rows get a Block button (and Unblock once blocked): it sets status blocked, which decide() maps to a new \"Access blocked\" lock screen on every device (online), and writes ips/<ip> docs with blocked:true for every IP the account used. A new account or guest from a blocked IP is created with status blocked instead of trial/pending. Unblock returns the account to pending and clears the blocked flag on its IPs; the approve checkbox is disabled while blocked. Rules: ips now allow admin create/update, and user create accepts status blocked (harmless, users cannot lift it). REQUIRES re-publishing firestore.rules. Limits: IP-based, so a new email on another network or VPN gets through; shared IPs (school, home wifi, CGNAT) can block innocent people, which is why Unblock exists.",
      "v1.3.45.0: LAX asked for a way to try the app without registering. The login page now has a \"Try free for 30 minutes (no sign-up)\" button that signs in with Firebase Anonymous auth and creates a normal trial doc (name Guest, empty email), so the 30-minute timer, the tracker and the one-trial-per-IP rule all work unchanged. When the guest trial ends the lock screen says to register and message LAX, with a Register button (signs the guest out and opens the register form); the new email account from the same IP starts pending and LAX approves it. firestore.rules create rule now also accepts email '' for anonymous tokens. REQUIRES: enable Anonymous in Firebase Authentication > Sign-in method and re-publish firestore.rules; until then the button shows 'Trying without an account isn't available right now'. Limits: clearing browser data gives a new anonymous uid, but the IP rule still blocks a second trial from the same IP; guests have no email so LAX can only tell them apart by device/IP/name (Rename helps)."
    ]
  },
  "2026-10-06": {
    stamp: "v1.3.41.1 – v1.3.44.1",
    title: "Missed Questions column header renamed to Exam Missed Questions; IP check for trials; Math Day 14 Handout, Sample Problems, Trivia and Problem Set",
    body: [
      "v1.3.41.2: LAX asked to record each user's IP and deny a new trial when that IP already used its 30 minutes. The browser looks up its public IP (api.ipify.org, 4 s timeout, fails open) and stores it in the device entry; a new ips/<ip> doc (rules: signed-in get, create only for own uid, admin list/delete) records which account claimed that IP first. A new account from an already-claimed IP is created as pending (rules now allow create with status trial or pending) instead of trial, so LAX can still approve it by hand. Tracker shows IP per device and searches it; deleting an account also frees its IPs. Disclosed limits: client-reported so spoofable/blockable, shared IPs (home wifi, school, mobile CGNAT) cause false positives. REQUIRES re-publishing firebase/firestore.rules; until then the ips lookup fails open and everyone still gets a trial.",
      "v1.3.41.1: LAX asked to rename the 5th column header from Missed Questions to Exam Missed Questions. Changed only the two visible col-headers spans (Quick Access and the Full Course Library panel); the Missed Questions Compilation view titles, menu item labels, quiz labels and internal ids were left as they are. Patch bump, Changelog entry added, file renamed to v1.3.41.1.",
      "Verification: node --check on the script, CSS braces balanced, no mojibake.",
      "v1.3.42.0: LAX uploaded the Math Day 14 Handout and Sample Problems docx files (Engineering Economics: depreciation, capital recovery, capitalized cost, bond value, annual cost, benefit-to-cost). Activated both. Day 14 had no views (only the blurred buttons), so view-handout-math-14 and view-samples-math-14 were created, 14 was removed from pendingContentMathHandouts / pendingContentMathSampleProblems and added to the available lists, and math14FormulaOutline was added (I to VI = Handout headings, shared with the Day 14 quizzes later). Problem Set, Trivia and Missed 14 stay blurred.",
      "Handout 14: six sections (Depreciation with five concept cards: straight line, sinking fund, declining balance, SOYD, MACRS; Capital Recovery; Capitalized Cost; Bond Value with the source cash flow diagram embedded as base64; Annual Cost; Benefit-to-Cost Ratio) and 12 sample problems. The docx lists problems only (no choices, no answers), so all 12 were solved from scratch. Source issues fixed or assumed: the SOYD shortcut printed [38/36] and was corrected to 30/36 (8+7+6+5+4 = 30); the B/C annual cost formula lost its SV numerator, restored as FC/[P/A factor] minus SV/[F/A factor]; the SOYD problem gives no salvage value so SV = 0 was assumed (BV = $2,142.86); the motor and generator annual cost gives no interest rate, so no interest on investment is charged ($2,915.50); the volleyball court has no life, so it is treated as a perpetuity ($7,200); the bond-at-par redemption C = face value is assumed for both bond problems (P8,940.60 and $925.31); capital recovery uses the sinking fund formula ($5,956.19, the straight line formula would give about $5,920); the MACRS salvage value $6000 is not used by the handout formulas (BV3 = $7,200). One addition to the theory: for year k the SOYD numerator is n-k+1.",
      "Sample Problems 14: 10 depreciation problems (4 straight line, 6 SOYD) with data-topic filter. No key was supplied, so answers follow the source solutions and each was re-computed. Disclosed in the hints: problem 1 printed a total of P3,972.28 (typo for P3,927.27), BV = P5,072.73, nearest choice C; problem 2 choice D was printed P16,00.00 and fixed to P16,000.00, and the question asks for the first three years while the source solution gives the yearly P16,000 (the 3-year total would be P48,000, choice A); problem 5 wrote Dep3 where it meant Dep1 and rounds BV to P7,545.00 (exact P7,545.45); problems 7 and 9 differ from the printed choices by rounding only; problem 10's source solution stops after SOYD = 105, the rest was solved (P4,800, choice B).",
      "v1.3.43.0: LAX pasted 15 questions plus an answer key labelled \"trivia day 4\". Day 4 trivia already existed, and the topics (depreciation, capitalized cost, bonds) are Math Day 14, so it was activated as Math Trivia Day 14 (assumption told to LAX). Day 14 had no trivia view, so view-trivia-14 was added after view-trivia-13, trivia14Data + renderQuiz (math14FormulaOutline) after Trivia 13, 14 added to availableTriviaDays and removed from pendingContentTriviaDays. Added Payout Period and Rate of Return to section II of math14FormulaOutline.",
      "Trivia 14: all 15 follow LAX's key. 14 of 15 re-computed to match. Q15 (capitalized cost, key D $181,388) does NOT match: the handout formula gives about $189,717, which is not a choice (closest is B $194,608); the key was followed and the mismatch disclosed in the hint. Q14 matches only if the maintenance is subtracted from the benefit ((20,000-5,000)/6,509.82 = 2.30, per the handout formula). Q8 assumes zero salvage (none stated); Q12 includes no interest (none given).",
      "Verification: node --check on the script, CSS braces balanced, no mojibake; Playwright with a local MathJax: handout shows 12 sample problems and the diagram, samples show 10, no raw LaTeX and no MathJax errors; backslash audit on the new blocks clean; home page shows Day 14 Handouts and Sample Problems enabled and unblurred.",
      "v1.3.44.0: LAX sent Math Problem Set Day 14 as a docx plus the answer key. The docx arrived empty (4 bytes), so LAX pasted the full question text and key in the project chat instead. Item 7 is missing from the paste (the key says 7 = D), so the set has 43 questions (the quiz numbers them 1 to 43; source numbers 8 to 44 are shifted down by one). New view-ps-14 and quiz-ps-14 (there was no view before, only the blurred button, so there was no in-view blur to remove); Day 14 added to availableProblemSets and removed from pendingContentProblemSets. Shares math14FormulaOutline; added the topic Depreciation Tax Savings (Present Worth) to section I and a new section VII General Engineering Economy Applications (Present Worth Comparison, Break-even Analysis, Incremental Cost, Profit and Expected Return).",
      "All 43 were solved independently against LAX's key. 30 match LAX's key without a conflict. Cleaned in the text: units written 'per year/per hour/per month' instead of slashes; Q1 had a garbled salvage sentence (salvage taken as zero); Q15 printed $12,000 where the handout version of the same problem uses $1200 (only $1200 gives a choice, $4,950); Q41 choice B was printed P1212,323.42 and fixed to P212,323.42; Q44 choices lost a stray P and the gas cost 'per year' is read as per mile; Q9 lost its choice letters, arranged as Plan A, B, C, A or B so key A = Plan A (the computation gives A at $250,000); Q42 has no interest rate, 10% assumed and 3% tax on the first cost reproduces the key to the peso (P111,617.79).",
      "Key mismatches followed the key and disclosed in the hints (flag to LAX): source Q3 printed A 141,131 vs computed 161,131; Q4 key D 168,940 not reproducible (20% of sales gives 116,685, 20% of cost gives 108,840); Q5 computes to $2,480 vs key $2240; Q6 computes to $21,411 (after-tax 0.6 reading gives $32,116, near choice A) vs key D $32,715; Q10 computes 22.45% vs printed 22.95%; Q16 computes DSRP-3 cheaper by $7,362 vs key 'steel pipe cheaper by $7982'; Q22 handout formula (B-OM)/C gives 2.30, the key 1.73 comes from B/(C+OM); Q33 computes 8% (choice C) vs key D 10%; Q35 computes $5,454,473 vs key D $5,572,473; Q37 key A $5455 is only the sinking fund depreciation, the full capital recovery is $8,654.61; Q43 computes the wood (B) cheaper vs key A. Q1 (4679 vs 4697.09) and Q14 (4325 vs 4320) are typo-level differences.",
      "Verification: node --check on the script, CSS braces balanced, no mojibake; Playwright with a local MathJax: view-ps-14 shows 43 questions and 858 math spans, no raw LaTeX and no MathJax errors; all 43 topics exist in math14FormulaOutline (no Other group); answer indexes equal the key; backslash, nested-wrap and slash-fraction audits on the new block clean; Day 14 Problem Set no longer blurred on the home page (only Missed Questions still is, after Trivia 14 was merged first).",
      "v1.3.44.1: LAX sent the missing Problem Set 14 question 7 (Company A, $200,000 equipment, 20 yr straight line, 16%, 40% tax, key D). Added as question 7 under Depreciation Tax Savings (Present Worth), so the set is now 44 questions and the numbering matches the source. It matches the key: 10,000 per year x 0.40 = 4,000 per year x 5.9288 = $23,715 (choice D). Earlier entry saying 43 questions and item 7 missing is superseded."
    ]
  },
  "2026-10-05": {
    stamp: "v1.3.37.0 – v1.3.41.0",
    title: "Contact-LAX note for Missed Questions; 30-minute trial gate and hidden device tracker; Math Day 13 Handout, Sample Problems and Problem Set",
    body: [
      "v1.3.37.0: LAX (MJ) asked for a note so students can send in missed questions of their own: \"You got missed questions? Contact (LAX) and let him know, so we can add them to the compiled questions\", with (LAX) as a clickable link to http://m.me/mj.d.laxamana/. Added a .missed-contact-note paragraph under the Math Quick Access grid on the home page and under the subtitle of all 12 Missed Questions Compilation views; the link opens in a new tab (target=_blank, rel=noopener noreferrer). Lightly fixed the grammar of the wording and kept the meaning. Version 1.3.37.0 (minor, small user-facing feature on the Missed Questions column).",
      "v1.3.38.0: LAX (MJ) asked for a hidden admin tracker (tap the LAX logo 10 times, then sign in) plus a 30-minute free trial per device, after which a device must register a name, message LAX and be approved. Decisions from LAX: trial counted from the device's first visit; approval is permanent but has a check/uncheck toggle (unchecking = revoked, no access now or later until re-approved); fail-closed and online-only (offline = locked); the Message LAX button is the existing m.me link, with no platform name shown.",

      "v1.3.38.1: LAX kept hitting the offline lock screen on a weak connection and we could not tell a bad signal from a setup problem, so the offline screen now prints the Firebase error code (e.g. auth/..., permission-denied) under Try again.",

      "v1.3.38.3: the real cause of LAX's lock screen was auth/admin-restricted-operation, i.e. Anonymous sign-in was not enabled in the Firebase console (a setup step, not connectivity). The offline screen wrongly blamed the internet for every error, so non-network errors now say \"Could not verify access\" and show the code.",
      "v1.3.39.0: LAX asked for a general login for non-admin users: register, which sends the account to LAX's tracker where emails and devices are visible with check/uncheck. Built as email + password accounts (Firebase Auth Email/Password, already enabled) instead of anonymous sign-in, which also removes the Anonymous provider requirement that was blocking LAX. Decisions I made and disclosed: the 30-minute trial now starts at registration and belongs to the ACCOUNT (the old per-device trial needed anonymous auth); when it ends the client moves the account to pending automatically so it shows under Pending; approval is per account (checkbox, uncheck = revoked); each browser an account logs in from is recorded as a device (random id in localStorage + browser/OS) and listed under the account in the tracker.",
      "v1.3.39.1: LAX asked for Quick Access to show Math Day 12 to 16 and the Math Full Course Library to go to Day 16 with no content. Quick Access loop now runs 12 to 16, SUBJECT_CONFIG math days is 16, and the pendingContent lists for Math Handouts/Sample Problems/Problem Set/Trivia got 13-16 so those days blur (Missed Questions already blurs when not in availableMathMissed). Days 13-16 have no views yet; the buttons are disabled so nothing opens.",
      "Reversal by LAX the same day: the earlier decision \"fail-closed, online only\" was dropped (slow connection kept locking LAX out). Now the last server status is cached in localStorage (meb_gate_cache: uid, status, firstSeen, server offset); an approved or in-trial account opens instantly from the cache and is verified in the background, and offline/slow-connection failures keep the app open ('Offline mode', banner shows trial minutes left from the cached server offset). With no cache (first visit, logged out) the app still stays covered. Trade-off: a revoke only takes effect when the device next reaches Firebase; an offline user can also fake the local clock to stretch the trial.",
      "v1.3.39.2: LAX wanted the login page as the default first screen, not an error. A browser that has never logged in (no meb_has_session flag in localStorage, no cached status) now shows the Log in form immediately, with Register as the secondary link, and preloads Firebase in the background; connection problems while submitting show as an inline note instead of the full-screen error. The admin session also sets the flag so LAX's own browser still goes through the normal check. (Another thread shipped v1.3.39.1 in between, so this is .2.)",

      "v1.3.39.4: LAX asked for the homepage welcome paragraph to also appear on the login page, justified on both. The login form clones #view-home .welcome-note (single source of text, no copy to keep in sync) and .welcome-note got text-align: justify.",
      "v1.3.39.5: LAX wanted Delete to remove the entry from the database for real (the v1.3.39.3 button only removed one device line, so the account still showed under Trial). Added a per-entry Delete button using deleteDoc, and firebase/firestore.rules now allows delete for the admin only (was `if false`), so the rules must be re-published. Trade-off I told LAX about: deleting the document does not delete the Firebase Auth user, so if that person logs in again they come back as a new account with a fresh 30-minute trial; to stop them for good the email must also be deleted under Firebase Authentication > Users.",
      "v1.3.39.7: LAX also wanted the account name itself renamable by the admin (accounts showing (no name)). Added a Rename button beside the name; it writes a new top-level adminName field, shown in preference to the user-typed name and included in search. Visitors cannot write it (rules only allow devices/status/lastSeen on update), so no rules change is needed.",
      "v1.3.39.6: LAX asked for an admin-only rename/note per device so they know whose device it is. Stored in a separate top-level deviceNotes map (deviceNotes.<deviceId>) on the account document instead of inside devices.<id>, because each browser rewrites its own devices entry every 30 seconds (that would wipe the label) and because the rules only let a user touch devices/status/lastSeen, so a user cannot edit the admin's labels. No rules change needed. Caveat: a user can still read their own document, so the labels are not secret from that user. Deleting a device also removes its label.",

      "Also found and fixed a missing comma after the v1.3.37.0 bullet in this diary (a syntax error from an earlier session that stopped the whole diary script from running); the diary script now passes node --check.",

      "All 15 solved independently and all match LAX's key. Disclosed in the hints: Q4 states no interest rate; without interest it is 66.7 months (5.6 years), which is not a choice, but 12% compounded monthly gives n = 110 months = 9.2 years (key C), so that rate is assumed. Q9 computes to P3,942.44 and D (P3,940) is the nearest choice. Q6 treats 'starting 4 years from now' as the first payment at month 48 (annuity valued at month 47). Q15 uses the effective monthly rate (1.06^(1/12) - 1) because the loan is compounded annually; 6%/12 would give P111.02, not a choice. Q11 converts 8% compounded quarterly to a semi-annual rate of 4.04%. Q3 follows the gradient formula (A = 1500, G = 300).",
      "Verification: node --check on the script, CSS braces balanced, no mojibake; render check of view-trivia-13 for 15 questions and filter panel."

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const dowLabels = ["S","M","T","W","T","F","S"];

function pad2(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function startDow(y, m) { return new Date(y, m - 1, 1).getDay(); }

const sortedDates = Object.keys(entries).sort();

// Default to the month of the most recent entry (i.e. "now" for this file).
let viewYear, viewMonth;
if (sortedDates.length) {
  const [ly, lm] = sortedDates[sortedDates.length - 1].split('-').map(Number);
  viewYear = ly; viewMonth = lm;
} else {
  viewYear = 2026; viewMonth = 9;
}

const grid = document.getElementById('cal-grid');
const monthLabelEl = document.getElementById('cal-month-label');
let selected = null;

function formatEntryDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${MONTH_NAMES[m - 1].slice(0, 3).toUpperCase()} ${pad2(d)}, ${y}`;
}

function renderEntry(key) {
  const panel = document.getElementById('entry-panel');
  if (!key) {
    panel.innerHTML = '<div class="empty-state">Select a highlighted date above.</div>';
    return;
  }
  const e = entries[key];
  const idx = sortedDates.indexOf(key);
  const prev = sortedDates[idx - 1];
  const next = sortedDates[idx + 1];
  panel.innerHTML = `
    <div class="entry">
      <div class="entry-head">
        <span class="entry-date">${formatEntryDate(key)}</span>
        <span class="stamp">${e.stamp}</span>
      </div>
      <div class="entry-title">${e.title}</div>
      <div class="entry-body">${e.body.length ? '<ul>' + e.body.map(p => `<li>${p}</li>`).join('') + '</ul>' : '<div class="no-content">No practice-hub work recorded for this date.</div>'}</div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prev-btn" ${prev ? '' : 'disabled'}>&larr; ${prev ? formatEntryDate(prev) : ''}</button>
      <button class="nav-btn" id="next-btn" ${next ? '' : 'disabled'}>${next ? formatEntryDate(next) : ''} &rarr;</button>
    </div>
  `;
  if (prev) document.getElementById('prev-btn').onclick = () => selectDate(prev, true);
  if (next) document.getElementById('next-btn').onclick = () => selectDate(next, true);
}

function selectDate(key, jumpMonthIfNeeded) {
  selected = key;
  if (jumpMonthIfNeeded) {
    const [y, m] = key.split('-').map(Number);
    if (y !== viewYear || m !== viewMonth) {
      viewYear = y; viewMonth = m;
      renderCalendar();
    }
  }
  document.querySelectorAll('.cal-cell.has-entry').forEach(c => {
    c.classList.toggle('selected', c.dataset.key === key);
  });
  renderEntry(key);
  document.getElementById('entry-panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderCalendar() {
  grid.innerHTML = '';
  monthLabelEl.textContent = `${MONTH_NAMES[viewMonth - 1].toUpperCase()} ${viewYear}`;

  dowLabels.forEach(l => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = l;
    grid.appendChild(el);
  });

  const lead = startDow(viewYear, viewMonth);
  for (let i = 0; i < lead; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  const total = daysInMonth(viewYear, viewMonth);
  for (let d = 1; d <= total; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const el = document.createElement('div');
    const hasEntry = entries.hasOwnProperty(key);
    el.className = 'cal-cell' + (hasEntry ? ' has-entry' : ' empty-day');
    el.textContent = d;
    el.dataset.key = key;
    if (hasEntry) {
      const count = entries[key].body.length;
      let level = 1;
      if (count >= 18) level = 5;
      else if (count >= 15) level = 4;
      else if (count >= 12) level = 3;
      else if (count >= 9) level = 2;
      el.classList.add('heat-' + level);
      if (key === selected) el.classList.add('selected');
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `${MONTH_NAMES[viewMonth - 1]} ${d}, ${count} logged changes`);
      el.title = `${count} logged changes`;
      el.addEventListener('click', () => selectDate(key, false));
      el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectDate(key, false); } });
    }
    grid.appendChild(el);
  }
}

document.getElementById('cal-prev-month').addEventListener('click', () => {
  viewMonth -= 1;
  if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
  renderCalendar();
});
document.getElementById('cal-next-month').addEventListener('click', () => {
  viewMonth += 1;
  if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
  renderCalendar();
});

renderCalendar();
renderEntry(null);
</script>
</body>
