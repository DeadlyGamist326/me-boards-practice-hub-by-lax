<title>Development Log — ME Boards Practice Hub</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #333333;
    --muted: #6b7280;
    --line: #d8dde3;
    --heat-1: #e3edf9;
    --heat-2: #a9c9ec;
    --heat-3: #5c93d8;
    --heat-4: #2563b0;
    --heat-5: #123a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417;
      --panel: #1b1e23;
      --ink: #eaeaea;
      --ink-soft: #cfcfcf;
      --muted: #8a8f98;
      --line: #333844;
      --heat-1: #1c2b3d;
      --heat-2: #274a72;
      --heat-3: #336aa8;
      --heat-4: #4d8fd6;
      --heat-5: #7fb4ec;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417;
    --panel: #1b1e23;
    --ink: #eaeaea;
    --ink-soft: #cfcfcf;
    --muted: #8a8f98;
    --line: #333844;
    --heat-1: #1c2b3d;
    --heat-2: #274a72;
    --heat-3: #336aa8;
    --heat-4: #4d8fd6;
    --heat-5: #7fb4ec;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 70px;
  }

  header.masthead { margin-bottom: 24px; }
  .eyebrow { font-size: 13px; color: var(--muted); }
  h1 {
    font-weight: 700;
    font-size: clamp(24px, 5vw, 32px);
    margin: 4px 0 6px;
    line-height: 1.2;
  }
  .sub {
    color: var(--muted);
    font-size: 14.5px;
    max-width: 52ch;
    line-height: 1.5;
  }

  /* Calendar */
  .cal-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px;
  }
  .cal-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-month {
    font-weight: 700;
    font-size: 15px;
    min-width: 150px;
    text-align: center;
  }
  .cal-month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cal-month-btn {
    background: none;
    border: 1px solid var(--line, #444);
    border-radius: 6px;
    color: inherit;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 4px 9px;
  }
  .cal-month-btn:hover {
    background: var(--line, #444);
  }
  .cal-legend {
    font-size: 12px;
    color: var(--muted);
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .cal-cell.empty { visibility: hidden; border: none; }
  .cal-cell.has-entry {
    cursor: pointer;
    font-weight: 600;
    border-color: transparent;
    transition: outline-color 0.12s ease;
  }
  .cal-cell.has-entry:hover { outline: 2px solid var(--heat-4); outline-offset: 1px; }
  .cal-cell.has-entry:focus-visible {
    outline: 2px solid var(--heat-4);
    outline-offset: 2px;
  }
  .cal-cell.has-entry.selected {
    outline: 2px solid var(--ink);
    outline-offset: -2px;
  }
  .heat-1 { background: var(--heat-1); color: var(--ink); }
  .heat-2 { background: var(--heat-2); color: #0a1f33; }
  .heat-3 { background: var(--heat-3); color: #ffffff; }
  .heat-4 { background: var(--heat-4); color: #ffffff; }
  .heat-5 { background: var(--heat-5); color: #ffffff; }
  .cal-cell.empty-day {
    color: var(--muted);
    opacity: 0.45;
    border-style: dashed;
  }

  /* Entry panel */
  #entry-panel { margin-top: 22px; }
  .entry {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px;
  }
  .entry-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .entry-date {
    font-size: 13px;
    color: var(--muted);
  }
  .stamp {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--heat-4);
    background: var(--heat-1);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .entry-title {
    font-size: 19px;
    font-weight: 700;
    margin: 6px 0 14px;
    line-height: 1.3;
  }
  .entry-body ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .entry-body li {
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 9px;
    padding-left: 16px;
    position: relative;
    color: var(--ink-soft);
  }
  .entry-body li::before {
    content: "\2013";
    position: absolute;
    left: 0;
    color: var(--heat-4);
  }
  .entry-body li:last-child { margin-bottom: 0; }
  .no-content {
    font-size: 14.5px;
    color: var(--muted);
    font-style: italic;
  }

  .empty-state {
    text-align: center;
    padding: 36px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 12.5px;
  }
  .nav-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
  }
  .nav-btn:hover { border-color: var(--heat-4); color: var(--heat-4); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn:disabled:hover { border-color: var(--line); color: var(--ink-soft); }

  @media (max-width: 480px) {
    .wrap { padding: 22px 14px 56px; }
    .entry { padding: 18px 16px; }
    .cal-cell { font-size: 11.5px; }
  }
</style>
</head>

      "Still to do by hand on GitHub: make the repo public, set Settings → Pages → Source to GitHub Actions, and merge the working branch into main",
      "Uploaded 'Handouts Math Day 1.docx' (Algebra Day 1: Significant Figures, Factoring, Laws of Exponents, Equations, Matrices). No pandoc or docx library in the cloud container, so unzipped the docx and parsed its XML with a small script that turns the embedded OMML math into LaTeX",
      "The source had reference material plus problem statements only (no worked solutions, four problems with printed choices), so solved all 14 problems by hand and verified every answer with sympy before encoding anything: Cramer's rule on two 3×3 systems, quadratic and cubic roots, two nested-radical equations, and a 3×3 matrix set (determinants, product, inverse, transpose, cofactor, adjoint) plus the 4×4 determinant property",
      "Source problems found and handled rather than copied blindly: (x+y+z) = x²+3x²y+3xy²−y³ is a typo for (x+y)³ = x³+3x²y+3xy²+y³; x^(a/b) was printed with a cube root and is really the b-th root; \"Quadric\" (fourth degree) written as Quartic; the adjoint/cofactor matrices were garbled in extraction and rebuilt from the standard cofactor definition; list items 6–10 were duplicated by the extraction and kept once",
      "Added three things the source did not state but its own problems need: the row-scaling property of determinants (used by the 4×4 problem), A⁻¹ = adj(A)/det A, and the cofactor sign formula (−1)^(i+j)",
      "Built Math Handout Day 1 in the Day 9–12 page structure: 5 sections, 14 concept cards, and 14 sample problems (4 with printed choices), each with the 4-hint system and a full solution following the given-per-equation-boxed chain; the matrix problem with six parts is solved in a convenient order (inverse last) with a note saying so",
      "Hit the recurring placeholder-loop bug again (the pending-upload loop covered Days 1–12 and would have wiped Day 1); started the loop at Day 2 and removed Day 1 from the pending list so it is not blurred",
      "Verified: node --check, CSS brace balance, question count unchanged at 967, line endings still CRLF, zero mojibake, a real Chromium render with a local MathJax copy (0 math errors, 0 raw delimiters, 405 rendered expressions), the §1a grep audit, a backslash-run check, and a note/box chain check on all 14 solutions",
      "Bumped to v1.3.11.0 (minor, since a Handout went from not existing to fully built), renamed the file to match, and added the changelog entry. Known cosmetic point: the widest determinant-expansion boxes scroll sideways on phones (formula boxes already scroll), same as other handouts",
      "Reported that the live site did not show Handout Day 1: deploy was fine (Pages run succeeded); Day 1 lives under Full Course Library > Math, not the Day 9-12 Quick Access row. Then changed Common Factoring Identities in Handout Day 1 from a 2-column formula-grid to single-column one-line boxes (long equations); bumped to v1.3.11.1 (patch) and renamed the file.",
      "Added the long-box ruling to the in-file RULINGS block (\u00a74o area) and CLAUDE.md \u00a75c: boxes with long content take one full row instead of a 2-column grid. Ruling-only change, so v1.3.11.2 (patch) with no user-facing changelog entry; file renamed.",
      "Applied the long-box ruling to Handout Day 1: added CSS class .fb-long (grid-column 1/-1) and tagged 30 long formula blocks inside formula-grid-2/3 so each takes a full row (threshold ~26 visible chars in 2-col grids, ~20 in 3-col). Short ones stay in the grid. v1.3.11.3 patch, file renamed, changelog entry added.",
      "Handout Day 1 Matrices Sample Problem 1: the six Find: parts (A-F) were one dense paragraph; split into one line per part with <br>. v1.3.11.4 patch, file renamed, changelog entry added.",
      "Uploaded 'Sample Problems Math Day 1.docx' and built Math Sample Problems Day 1 (16 problems) as a new samples-math-1 view, wired into availableMathSampleProblems so it shows under Full Course Library > Math. Same parse approach as before (unzip docx, small script turning OMML into LaTeX). The docx has no answer marks, so every answer was derived and checked by hand",
      "Source issues handled: the docx stops partway through Problem 16 (solution cut off after the grouping step), so I finished the factoring by grouping to (3x-2a)(2x-3b); Problem 1's solution showed '-4t < -8' which is wrong, replaced with the proper divide-by-negative step; Problem 3 gave only the first absolute-value case, so I added the second case (x <= 0); Problem 5 was 'f apples' (If) and choice C lacked a $; Problem 13's solution printed S130 (should be $30); Problem 10's printed prices (1 1/4, 4 1/4) do not match its solution (1 3/4, 4 1/2), so the key answer D was followed with a disclosure line in Given",
      "Applied rulings: every fraction and mixed number is a standing \\dfrac fraction, each algebraic step is its own boxed formula-block with a note before it, short givens go in a formula-grid, no long boxes needed, the choices stay in the boxed layout; the Matrices-style one-line-per-item split did not apply (no multi-part questions)",
      "Added 'Practice by formula' for the page (math1FormulaOutline: Inequalities, Polynomials and Factoring, Arithmetic and Word Problems) via attachStaticTopicFilter and data-topic on all 16 problems",
      "Verified: node --check, CSS brace balance, question count unchanged at 967, zero mojibake, CRLF preserved, and a real Chromium render with local MathJax (16 problems, 210 rendered expressions, 0 math errors, no raw delimiters, filter present, clicking the correct choice marks it right). v1.3.12.0 (minor, since a Sample Problems set went from not existing to fully built), file renamed, changelog entry added",
      "Uploaded 'Problem Set Math Day 1.docx' plus MJ's answer key (31 items) and built Math Problem Set Day 1 (31 questions) as ps1Data, wired to the existing quiz-ps-1 view with the 4-tier hint system on every question. Same parse approach as before (unzip the docx, small script that turns the OMML math into LaTeX). Every answer was solved by hand and with sympy, then diffed letter by letter against MJ's key (31/31 match)",
      "Source issues handled: the docx dropped several choices and operators in conversion. Q5 choice C, Q7 choice C and Q9 choices A to C were missing or half-lost, Q19 choices C and D lost their signs, Q28's choices were one-row fragments of 2x2 determinants with a duplicate B and a stray E, Q12 choice A lost its radical index, and Q30 choice A printed as '91-' (read as 91). Each was rebuilt around the correct answer (the correct choice was always intact) with invented distractors built from typical mistakes (sign error, transpose, A+B); MJ was told which ones",
      "Q5 (3x3 system): the printed equations give A=2.04, B=-3.42, C=3.82, which matches no choice. MJ's key says D (1.38, -2.81, 4.32), which satisfies equations 1 and 3 but not equation 2 as printed, so the source likely has a typo in equation 2. Followed the key and put an explicit disclosure note in the hint, same convention as the Day 9-12 mismatches. Also normalised the mixed he/she pronouns in Q29 (she/her) and read the Q3 matrix as columns (4,2) and (1,6), which has the same determinant either way",
      "Applied rulings: every fraction and mixed number is a standing fraction (frac objects for 1/2 style choices, latex for mixed numbers and multi-term quotients), matrices, radicals and fractional exponents go through latex blocks, multi-equation questions put one equation per line, every tier-4 hint is given, then boxed steps with a note before each box, long boxes (matrices, determinant expansions) take a full row via fb-long, and short givens use formula-grids",
      "Found and fixed an engine bug while testing: a newline sitting between two math segments in q: was swallowed by the nowrap wrapper, so stacked equations ran together on one line. appendQuestionContent now flushes the math group when a space token contains a newline. Older questions only put the newline after plain words, so they render unchanged",
      "Hit the recurring placeholder-loop bug again: the Math Problem Set pending loop covered Days 1-4 and would have blurred Day 1 and overwritten its renderQuiz. Started the loop at Day 2 and removed Day 1 from pendingContentProblemSets",
      "Rebuilt math1FormulaOutline so it is shared by Sample Problems and Problem Set Day 1: sections I-V follow the Handout Day 1 headings (Significant Figures, Factoring and Polynomials, Laws of Exponents, Equations, Matrices), and VI-VIII hold the Sample Problems topics (Inequalities, Arithmetic and Word Problems, Complex Numbers and Indeterminate Forms). 20 topics on the 31 questions, none missing from the outline",
      "Verified: node --check, CSS brace balance, question count 967 to 998 (+31), zero mojibake, CRLF preserved, key diff 31/31, the 1a grep audit (no single-backslash commands, no plain sqrt/pi/integral/partial symbols, no bare carets, no unwrapped fractional exponents, frac padding fine), and a real Chromium render with local MathJax (31 questions, 124 hint panels, 512 rendered expressions, 0 math errors, no raw delimiters, filter selects Determinant and shows 3). v1.3.13.0 (minor, since a Problem Set went from not existing to fully built), file renamed, changelog entry added",
      "Math Trivia Day 1 built (v1.3.14.0): 15 questions from MJ's pasted LaTeX plus answer key, each with the 4-tier hint system, wired to the shared math1FormulaOutline (added topics Simultaneous Equations (Nonlinear), Percent and Discount, Prime Numbers, Complex Number Equality). Trivia placeholder loop now starts at Day 2",
      "Source cleanup: Q9 (x+1)2 read as (x+1) squared; Q6 choices C/D printed as 10.00^n, read as 1000^n (the only reading consistent with key C); Q8 duplicate $44.20 choice replaced with $43.20 (guess) and the printed total $168.70 does not give $46.20 (key D fits $161.70), disclosed in the hint; Q14 duplicate choice C replaced with a distractor minor matrix. All 15 keys match the supplied key; own solving agreed except Q8",
      "Verified: node --check, CSS brace balance, jsdom render (15 questions, filter present), zero mojibake, CRLF preserved",
      "v1.3.14.1: MJ reported Trivia Day 1 still looked blurred after v1.3.14.0. Cause: the old placeholder loop for Trivia Days 1-4 still ran markPendingEmpty on quiz-1, the same bug as the Problem Set loop earlier. Loop now covers Days 2-4 only; verified in jsdom that quiz-1 has no pending-empty class",
      "v1.3.14.2: MJ asked for the LAX word from the \"Made by LAX\" mark to become the official logo. Rendered it with Chromium from the real .lax-brand CSS (Cambria/Georgia/Times serif, #d4af37, raised A at 0.78em / 0.15em / -0.36em margin); cloud box has no Cambria so Liberation Serif was substituted. Logo PNG saved at /mnt/project-files/logo/LAX_logo.png. Embedded as base64: favicon + apple-touch-icon in <head> and a small logo above the home-page title (.home-logo). The header text mark stays live CSS. Version bumped 1.3.14.1 to 1.3.14.2 (patch), file renamed, CLAUDE.md filename updated.",
      "v1.3.14.3: MJ said the small \"Made by LAX\" header on the main menu is redundant next to the big LAX logo. syncHeaderContext now toggles body.on-home and CSS hides .made-by-credit on home (body starts with class on-home); other views keep the bar. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.4: MJ asked for Quick Access to read \"Math Day 1 to 12\". Heading changed and the featured loop now runs 1..12 (48 buttons). Math Sample Problems Days 2-8 have no content, so pendingContentMathSampleProblems was set to [2..8] so they blur like other pending items instead of appearing as plain disabled buttons (this also applies in the Full Course Library list). Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.5: MJ changed his mind: Quick Access should be Math Day 1 to 11 only. Heading and featured loop now stop at 11 (44 buttons); Day 12 is still reachable in the Full Course Library. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.6: LAX (the user now wants to be called LAX) said the A in the logo should be centered on the pointed end of the L. Moved .lax-a margins from -0.36em/-0.1em to -0.447em/-0.013em (same total width, so X does not shift) so the L foot tick nests in the A gap; re-rendered the PNG (/mnt/project-files/logo/LAX_logo.png) and re-embedded favicon, apple-touch-icon and home logo. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.7: LAX asked to move the X a bit to the left without overlapping the A. .lax-a margin-right changed from -0.013em to -0.05em (A position unchanged); checked in a render that the A foot and the X serifs do not touch. Re-rendered the PNG and re-embedded favicon, apple-touch-icon and home logo. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.8: LAX clarified that the letter boxes may overlap, only the gold ink must not touch. Rendered A and X separately at 352px for margin-right from -0.05em to -0.26em and measured the ink gap: ink touches at about -0.20em, so -0.15em was chosen (about 10px gap at 352px). .lax-a margin-right is now -0.15em. Re-rendered the PNG and re-embedded favicon, apple-touch-icon and home logo. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.9: LAX asked for the X angle to be similar to the A. Measured stroke slopes (dx/dy) at 352px: A leg 0.36, X 0.67 at normal width. Narrowed the X with scaleX(0.65) (slope about 0.43; 0.6 looked too condensed), with margins re-tuned so the gold ink gap to the A is about 12px. Because a font-based X can not be narrowed reliably across fonts (Windows has Cambria, not Liberation Serif), the header Made by LAX mark now uses the logo PNG (.lax-img) instead of the .lax-brand/.lax-a text styling, which was removed. Re-rendered /mnt/project-files/logo/LAX_logo.png and re-embedded favicon, apple-touch-icon and home logo. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.14.10: LAX uploaded the final logo (own edit: narrow X tucked against the A, 415x272 transparent PNG) and asked that the main page show Made by LAX, not just the logo. Replaced all embedded logo images (favicon, apple-touch-icon, header .lax-img) with the uploaded PNG, also saved as /mnt/project-files/logo/LAX_logo.png. Home: .home-logo replaced by .home-credit, i.e. Made by text (Cambria serif, gold, 28px) plus the logo image inline. Patch bump, file renamed, CLAUDE.md filename updated.",
      "v1.3.15.0: LAX uploaded 'Handouts math day 2.docx' (Complex Numbers, Complex Operations, Vectors, Problem-Solving in Algebra). Parsed the docx XML again (OMML to LaTeX) and built Math Handout Day 2 as four sections with 18 concept cards and 14 worked sample problems, each with the 4-tier hints and a granular note/box solution; the 10 end-of-handout problems were placed under their matching subsection (number, rate, work, age, mixture) and solved from scratch since the docx has no answer key",
      "Removed the blur placeholder for Math Handout Day 2 (the markPendingEmpty loop now starts at Day 3, and Day 2 left pendingContentMathHandouts) so it is no longer blurred on the home page or inside the handout view",
      "Source typos fixed and disclosed: 'Remember t squared = -1' now i squared = -1; polar form 'Z = r theta' now r angle theta; exponent 'i pi/4 i' now i pi/4; unit-vector formula was missing i, j, k; work-replacement text said 'A and B' where it means 'A and C'; the pumping formula for A, C inlet and B outlet was lost in the docx so it was rebuilt as 1/A + 1/C - 1/B = 1/T; problem 2 choice D was cut off so it was rebuilt as 16(1 - i); problem 3 choices were missing the i in cos + i sin; the mixture-removal picture printed (m1 + m2) on the right side, rebuilt as (m1 - m2)",
      "Left out on purpose: the vectors problem (A = 2i+4j+8k, parts A to F) because the docx never gives vector B, and part D refers to an undefined C. Waiting for LAX to supply B (and C) before adding it",
      "Version bump: 1.3.15.0 (minor) because a whole Handout day is now built; renamed the file to match. Syntax, CSS brace balance, jsdom render (4 sections, 14 sample problems, no pending overlay) and a MathJax parse of all 308 LaTeX snippets passed",
      "v1.3.15.1: LAX uploaded 'Sample_Problems_math_day_2.docx' (10 problems: exponential form and product of complex numbers, (MxN).P with vectors, and number problems). Parsed the docx XML (OMML) and built Math Sample Problems Day 2 as a new view-samples-math-2 with 10 sample problems, each with the 4-tier hints and a granular note/box solution. The docx has no answer key, so every problem was solved from scratch: B, D, B, A, C, C, B, A, B, A",
      "Practice by formula: added math2FormulaOutline (sections matching Handout Day 2) and attachStaticTopicFilter on samples-math-2. Home tile: Day 2 moved from pendingContentMathSampleProblems to availableMathSampleProblems, so it is no longer blurred. There was no placeholder blur inside the view because the Day 2 samples view did not exist before",
      "Source typos fixed and disclosed: the docx formula 'z e^{i0}' in problem 1 means r e^{i theta} (modulus r, angle theta), and its '3+4i = 5 e{i53.1}' lost the exponent braces and degree sign. Problem 8 working defined x as the smaller and y as the larger number, kept that. Problem 6 offers even numbers as wrong choices, kept as printed. The docx worked answers all agree with the derived keys, no mismatches found",
      "Version bump: 1.3.15.1 (patch) because one Sample Problems day is added; file renamed to match. Syntax, CSS brace balance, mojibake scan, jsdom render (10 problems, filter in header, answer letters BDBACCBABA) and brace balance of all LaTeX snippets passed",
      "v1.3.16.0: LAX pasted Math Trivia Day 2 (15 questions plus answer key) in the project thread. Added trivia2Data with a new math2FormulaOutline (I. Complex Numbers, III. Vectors, IV. Problem-Solving in Algebra, matching the Handout Day 2 headings), full 4-tier hints per question in the granular boxed style. Worked every question independently: all 15 match LAX's key (1 D, 2 B, 3 C, 4 B, 5 C, 6 B, 7 C, 8 A, 9 A, 10 D, 11 C, 12 B, 13 D, 14 D, 15 C). No mismatches. Q6 choice A is the resultant vector, not its magnitude (sqrt(456) = 21.35, choice B); Q12 reads the trip as 2 h going, 1 h stay, 3 h returning (60 kph). Typos fixed: 'X &amp; Y' to 'X and Y', 'travelling' wording, 'Mr. Manuel is gone' kept. Removed the blur for Day 2 (pendingContentTriviaDays and the markPendingEmpty loop now start at Day 3). Minor bump because a whole Trivia day is built; file renamed to match. Merged with the parallel Day 2 Sample Problems work (v1.3.15.1): its own math2FormulaOutline was combined with this one into a single declaration above Trivia Day 2 (two const declarations would have crashed the script), keeping both sets of topics. Day 2 Problem Set should reuse the same outline.",
      "v1.3.16.1: LAX pasted a vectors problem, (M x N) . P with M = 3i+2j, N = 2i+3j+k, P = 5i+2k, with a solution. Added it to Math Handout Day 2 under a new Sample Problems: Vectors heading, as the Day 2 vectors section had no sample problem. Re-derived the cross product (2i - 3j + 5k) and dot product (20, choice B), both match LAX's key. Fixed a typo in the pasted expansion (the j and k cofactor terms were garbled, rewritten as i[(2)(1)-(0)(3)] - j[(3)(1)-(0)(2)] + k[(3)(3)-(2)(2)]); numbered it 1 in the Vectors section since it was labelled Problem 3 and problems 1 and 2 were not supplied. Patch bump, file renamed. Also added a missing comma between the v1.3.15.1 and v1.3.16.0 bullets that broke the diary script",
      "v1.3.17.0: LAX uploaded 'Problem_Set_math_day_2.docx' (43 questions plus answer key). Parsed the docx XML (OMML fractions/superscripts) and built ps2Data with 4-tier hints per question in the granular boxed style, wired to the shared math2FormulaOutline for Practice by formula (Problem-Solving split into Number/Rate/Work/Age/Mixture subsections). Worked all 43 independently: 42 match LAX's key; Q36 (Martha average speed) works out to 48 (choice A) but the key says C (50), so the hint follows the key and discloses the mismatch",
      "Source problems found and disclosed in the hints: Q1 choice C and Q2/Q12/Q42 choice D were lost or garbled in the docx (rebuilt from the key: 19, 9, 30); Q7 lists one vector (3i+4j-5k, magnitude 7.07) but the key's 11.66 implies a lost second vector; Q10 'x times the sum' only matches the key (-3) with multiplier 6; Q15 gives 0.763 mph, nearest choice 0.8; Q28 choices B and C are identical (8½ min); Q31 says liters but choices are ml; Q4 exponent printed without i, read as e^{i5π/13}; truncated words ('he sum', 'Sanc', 'se') restored",
      "Merge notes: Trivia Day 2 had put math2FormulaOutline after where Problem Set Day 2 renders (temporal-dead-zone error), so the single shared outline now sits before ps2Data with the Trivia/Sample Problems topics kept and the Problem Set topics added; 'Consecutive Number Problems' renamed to the existing 'Consecutive Integers'. Problem Set Day 2 removed from pendingContentProblemSets and the pending placeholder loop now covers Days 3-4 only, so Day 2 is no longer blurred on the home page or inside the view",
      "Version bump: 1.3.17.0 (minor) because Math Problem Set Day 2 goes from not existing to fully built; file renamed to match. Verified: node --check, CSS brace balance, CRLF preserved, zero mojibake, jsdom render (43 questions, filter total 43, Trivia/Sample Problems Day 2 still render, Day 3 still blurred), every LaTeX snippet (666) parsed by KaTeX with no errors",
      "v1.3.18.0: LAX uploaded 'Handouts_math_day_3.docx' (no answer key). Parsed the docx XML (OMML) and built Math Handout Day 3: I. Problem-Solving in Algebra (Continuation: clock, geometric, investment), II. Variation, III. Binomial Theorem, IV. Partial Fraction, V. Permutations, with 18 sample problems solved from scratch in the boxed note/box style, plus the 4 source diagrams (clock, square, rectangle, triangle cropped from a picture that also had stray text) embedded as base64 images",
      "Removed the blur placeholder for Math Handout Day 3 (the markPendingEmpty loop now starts at Day 4 and Day 3 left pendingContentMathHandouts)",
      "Source problems found and disclosed: the abs-sum-of-coefficients problem (2x+3y-z)^8 literally gives 6^8 = 1,679,616 (not a choice); the choices match 4^8 = 65,536 (sum of coefficients), so choice A was used and a note added. Its choice A also lost its letter in the docx. Salary problem: exact answer is about $896, closest choice D ($900) used; its choice B lacked the $ sign. Partial fraction Case 2 printed A=2,B=3,C=5,D=1 but the true values are A=3,B=2,C=1,D=5; Case 4 printed B=2,C=-3,D=0,E=-1 but the true values are B=0,C=-1,D=2,E=-3 (the source swapped the two quadratic terms). Both were corrected (checked by exact substitution) and flagged with an on-page note; Case 3 had no printed values so A=1,B=2,C=-2 was added. The binomial general-term formula and the Case 1-4 'form' lines were added because the docx only gave the coefficient note; 0! = 1 was filled in (the docx showed '0! = .'); one unbalanced bracket in the Case 1 example was fixed",
      "Worked examples in the docx (ABC permutations, BANANA) became sample problems 14 and 16; the multi-part problems (clock A/B, (3x+4y)^8 A-D) are single sample problems with one answer line per part",
      "Version bump: 1.3.18.0 (minor) because a whole Handout day is now built; file renamed to match. Verified: node --check, CSS brace balance, Playwright render (5 sections, 18 sample problems, 4 images, no pending overlay, no page errors) and a MathJax parse of all 407 LaTeX snippets with 0 errors",
      "v1.3.19.0: LAX uploaded 'Sample_Problems_math_day_3.docx' (15 questions plus an answer key, no worked solutions; the docx itself is titled \"Trivia Math Day 3, Set A\" even though it was sent as Sample Problems, so it was built as Sample Problems as asked). Parsed the docx XML (OMML) and built the Day 3 sample problems with the 4-tier hints and granular boxed solutions, tagged with data-topic and wired to a new math3FormulaOutline (I. Ratio, Proportion and Variation; II. Clock Problems; III. Permutations and Binomial Theorem; IV. Problem-Solving in Algebra) through attachStaticTopicFilter. Added the missing view-samples-math-3 view, made Day 3 available and removed it from the pending (blurred) sample problem list.",
      "Worked all 15 independently: all match LAX's key (1 A, 2 B, 3 B, 4 B, 5 C, 6 B, 7 A, 8 C, 9 C, 10 B, 11 D, 12 A, 13 A, 14 C, 15 A). Source typos disclosed in the hints: Q1 ratio printed \"3.2\" (read as 3:2); Q10 exponent printed \"s\" and the choices \"y^B\" (read as 8); Q15 choices B and D are both 8 (kept as printed); the docx scrambled the order of several choice lists, which were re-matched to their questions.",
      "Version bump: 1.3.19.0 (minor) because Math Sample Problems Day 3 goes from not existing to fully built; file renamed to match (1.3.18.0 was taken by the Day 3 Handout, merged first). CRLF line endings preserved.",
      "v1.3.20.0: LAX pasted Math Trivia Day 3 (15 questions plus answer key) in the project thread. Added trivia3Data (placed after math3FormulaOutline, which Sample Problems Day 3 declared; reusing it means no second declaration, and putting the data earlier would crash on the temporal dead zone). Reused the same 11 topics, and added full 4-tier hints per question in the granular boxed style.",
      "Worked all 15 independently: all match LAX's key (1 A, 2 B, 3 B, 4 B, 5 C, 6 B, 7 A, 8 C, 9 C, 10 B, 11 D, 12 A, 13 A, 14 C, 15 A). Source issues: Q15 choices B and D are both 8 (disclosed in the hint; key A = 5 is correct); Q9/Q10 choices were typed in $...$ and 'a/b' form and were rebuilt as LaTeX with standing fractions; Q2/Q8 times are read as minutes with decimals (6:16.36 = 6 h 16.36 min). Q2 uses the first perpendicular time (m = 16.36), not the later 49.09 one.",
      "Removed the blur for Trivia Day 3 (pendingContentTriviaDays is now [4] and the markPendingEmpty loop starts at Day 4), so it is no longer blurred on the home tile or inside the quiz. Version bump: 1.3.20.0 (minor) because a whole Trivia day is now built; file renamed to match. Note: Sample Problems Day 3 was built from the same 15 questions (its docx was titled Trivia Math Day 3, Set A), so Day 3 Sample Problems and Trivia currently show identical questions.",
      "v1.3.21.0: LAX uploaded 'Problem_Set_math_day_3.docx' (42 questions plus an answer key). Parsed the docx XML (OMML) and built Math Problem Set Day 3 with the 4-tier hints and granular boxed solutions, tagged with topics and wired to math3FormulaOutline. The outline was moved up to sit before the Problem Set data (the Sample Problems thread had declared it after the Problem Set code runs, which would have been a const used-before-declaration error) and expanded; sections are now I. Ratio, Proportion and Variation; II. Clock Problems; III. Permutations and Binomial Theorem; IV. Partial Fractions; V. Problem-Solving in Algebra",
      "Worked all 42 independently: all match LAX's key. Source typos disclosed in the hints: Q4 choice A had a stray mark (read as 30.23); Q5 cent sign garbled (read as 16¢); Q6 question ended at \"12\" (read as 12%); Q7 stopped at \"Find the area of\" (read as the lot); Q25 key D only works if both the 15% discount and the 30% profit are taken on the retail price; Q29 choices said kg for a force (changed to N); Q30 choice D is printed as \"2\" (kept). Minor silent fixes: Q11 \"a\" read as \"and\", Q12 KN written as kN",
      "Removed the blur placeholder for Math Problem Set Day 3 (Day 3 left pendingContentProblemSets, and the markPendingEmpty loop now starts at Day 4). Version bump: 1.3.21.0 (minor) because Math Problem Set Day 3 goes from not existing to fully built; file renamed to match (1.3.20.0 was taken by Trivia Day 3, merged first). CRLF line endings preserved. Verified: node --check, CSS brace balance, mojibake scan, Playwright render (42 questions, filter panel, no pending class on the home tile) and a KaTeX parse of all 547 LaTeX snippets with 0 errors",
      "v1.3.22.0: LAX uploaded 'Problem_Set_math_day_4.docx' (44 questions plus an answer key; probability, expectation, counting and basic statistics). Added math4FormulaOutline (I. Probability, II. Permutations and Combinations, III. Statistics and Series) and ps4Data with all 44 questions, 4-tier hints and topics; renderQuiz is called with the outline so the Practice by formula filter works. Standing fractions in choices use frac with the padding rule; the fractions inside hints are dfrac in MathJax.",
      "Worked all 44 independently against LAX's key: all match except Q34. Disclosed in the hints: Q34 (sum of 9 or 11 with 3 dice) counts 25 + 27 = 52/216 (choice D) but the key says B 54/216, so the key was followed; Q40 and Q43 compute to 0.822 and 0.0473, nearest listed choice (the key) was used. Source cleanup: Q25 list was cut off and read as 11 (gives 9, matches key); Q28 choice D was cut to '33' and rebuilt as 336; Q42 choice A kept as printed 8/5; Q44 choice D '2.' rebuilt as 2; Q17 assumes no replacement (gives 0.5, matches key); Q22 assumes every student likes at least one subject; Q23 had a stray '?3.' prefix removed.",
      "Removed the Problem Set Day 4 blur: pendingContentProblemSets is now empty and the markPendingEmpty loop for quiz-ps-4 was replaced by the real quiz. Version bump 1.3.22.0 (minor) because Math Problem Set Day 4 goes from not existing to fully built (1.3.21.0 was taken by Problem Set Day 3). Checks: node --check, CSS brace balance, jsdom render (44 questions, filter present, no raw LaTeX delimiters in choices).",
      "v1.3.23.0: LAX uploaded 'Sample_Problems_math_day_4.docx' (13 probability problems, no answer key). Parsed the docx XML (OMML) and built Math Sample Problems Day 4 with the 4-tier hints and granular boxed solutions (samples-math-4, attachStaticTopicFilter). Reused the math4FormulaOutline the Problem Set Day 4 thread declared (merged first as 1.3.22.0), retagging the problems to its existing topics and adding two topics to section I (Non-Mutually Exclusive Events, Single Draw).",
      "Solved all 13 from scratch (no key): 1 B, 2 C, 3 D, 4 B, 5 C, 6 D, 7 D, 8 D, 9 C, 10 D, 11 A, 12 A, 13 A. Source issues disclosed on the page: Q3 missing 'A'; Q5 total printed 0.530 (exact 8/15 = 0.533, same choice); Q6 text cut off ('with ,000 tickets', the solution uses 2,000); Q8 first-term exponent printed (2/3)^(1/3) (typo for ^1); Q9 formula shows q^n and a stray '64/81' line; Q10 states p = 1/2 but its solution uses p = 3/4, q = 1/4 (hit probability 1/4) giving 0.132, which is in none of the printed choices (copied from Q9), so the question is stated with 1/4 and choice D was rewritten to 0.132; Q12 has a garbled P_T line, ignored.",
      "Unblurred the home tile (4 left pendingContentMathSampleProblems, joined availableMathSampleProblems). Version bump: 1.3.23.0 (minor) because Math Sample Problems Day 4 goes from not existing to fully built; file renamed to match (1.3.22.0 was taken by the Day 4 Problem Set, merged first).",
      "v1.3.24.0: LAX uploaded 'Handouts_math_day_4.docx' (no answer key). Parsed the docx XML (OMML) and built Math Handout Day 4 as seven sections: I. Combinations, II. Probability, III. Laws of Probability, IV. Binomial Distribution, V. Measures of Central Tendency, VI. Measures of Dispersion, VII. Venn Diagram, with 23 sample problems (each with the 4-hint system and a granular boxed solution). Solved everything from scratch since there was no key.",
      "Regrouped on purpose: the docx lists all the probability problems under IV, so they were moved under the section they actually exercise (single/independent events under II, total probability and expectation under III, binomial under IV, the mean/median/mode problem under V). Sample problems are numbered 1 to 23 in page order, not in docx order.",
      "Source issues disclosed in the hints: coin problem labelled A, A, B in the docx (relabelled A to C); the ticket problem says '90 tickets numbered 1-190' (read as 190 tickets, 'between 79 and 179' inclusive = 101/190, with the exclusive 99/190 noted); choice A of the marksman problem printed as '3 1/4' (read as 3/4); 'one of the two balls will be orange' read as exactly one (0.46; at least one would be 0.58); 'M or H nor W' read as (M or H) but not W = 6. Added a small inclusion-exclusion concept card to the Venn section since the docx gave no theory there.",
      "Removed the blur placeholder for Math Handout Day 4 (Day 4 left pendingContentMathHandouts and the markPendingEmpty loop now starts at Day 5). Version bump: 1.3.24.0 (minor) because a whole Handout day is now built; file renamed to match (1.3.20.0 to 1.3.23.0 were taken by Trivia Day 3, Problem Set Day 3, Problem Set Day 4 and Sample Problems Day 4, merged first).",
      "v1.3.25.0: LAX uploaded 'Handouts_math_day_5.docx' (Algebra and Trigonometry Day 5, no answer key). Parsed the docx XML (OMML to LaTeX) and built Math Handout Day 5 as thirteen sections: I. Arithmetic Progression, II. Geometric Progression, III. Harmonic Progression, IV. Classification of Angles, V. Measurement of Angles, VI. Right Triangle and Trigonometric Functions, VII. Angle of Elevation and Angle of Depression, VIII. Logarithms, IX. Exponential Growth and Decay, X. Sine Law, XI. Cosine Law, XII. Trigonometric Identities, XIII. Bearing and Directions, with 18 sample problems (4-hint system, granular boxed solutions), numbered 1 to 18 in page order. The 4 source diagrams (right triangle, elevation, depression, bearing compass) are embedded as base64 images.",
      "Solved all 18 from scratch and cross-checked numerically: 1) 340, 2) 32530.75, 3) 1/5, 4) 180 m, 5) 12, 6) B Geometric, 7) 1/sqrt(1-x^2), 8) C, 9) 22.43 m, 10) x = 4, 11) B, 12) 126.23 hr, 13) 17.33 min, 14) C, 15) D (3pi/2), 16) B = 120.94 deg, 17) 14.43 mi, 18) 12 ft.",
      "Source issues disclosed on the page or fixed quietly: antilog was written as 1/log (corrected to the inverse function b^y); cos(x±y) was printed with ± instead of ∓ (corrected); infinite series condition printed as 'r ≠ 1' (now |r| < 1); L = ar^(n-1) was garbled, a^y was written with a gamma, x_a/2 should be x_0/2, and 1 rev listed 2π rad twice; the log equation in the log problem has base 2 on the first log only (both read as base 2, the only reading with a clean answer, x = 4); the cooling exponent was printed -0.041 (typo for -0.04t); problem 3 also fits r = -3/2 (a = -1/5), the positive ratio is used; problem 16 is an obtuse angle, so the sine law alone gives 59.06 deg and only the cosine law route gives the right 120.94 deg. Added a small 'signs of the trigonometric functions' card (problem 8 needs it, the docx had none).",
      "Regrouped on purpose: the docx lists all the problems in two blocks, so they were moved under the section they exercise (sequence identification under III, flagpole under VII, ships under XIII, guy-wire poles under VI, and so on). Source choice lists were kept where given (6, 8, 11, 14, 15). Added a math5FormulaOutline constant (section names match the handout h2 headings) for the later Day 5 Sample Problems, Problem Set and Trivia to reuse; it is not wired to a quiz yet.",
      "Removed the blur placeholder for Math Handout Day 5 (Day 5 left pendingContentMathHandouts and the markPendingEmpty loop now starts at Day 6). Version bump: 1.3.25.0 (minor) because a whole Handout day is now built; file renamed to match.",
      "v1.3.26.0: LAX uploaded 'Handouts_math_day_7.docx' (Analytic Geometry, no answer key). Wrote a small OMML-to-LaTeX parser for the docx XML (fractions, radicals, determinant matrices) and looked at all 17 embedded diagrams, since several formulas (intercept form, perpendicular slope) exist only as images. Built Math Handout Day 7 as five sections: I. Cartesian Coordinate System, II. Straight Line, III. Properties of Lines, IV. Conic Sections: Circle, V. Conic Sections: Parabola, with 17 sample problems, each with the 4-hint system and a granular boxed solution. All 17 diagrams are embedded as base64 images inside .question-image (added a small max-width rule for img there). Solved everything from scratch; every printed multiple-choice key came out as a single choice.",
      "Regrouped on purpose: the docx puts every line problem after Properties of Lines, so they were moved under the section they exercise (two-point, slope-intercept, intercept form, length to the y-axis and intersection under II; the perpendicular line under III). Sample problems are numbered 1 to 17 in page order. The stray 'I.' label in front of the slope 4/3 problem was dropped.",
      "Source issues disclosed on the page: the definition of a line as 'locus equidistant to two fixed points' is really a perpendicular bisector, so it was reworded; the point-to-line and parallel-line distance formulas were printed without absolute-value bars, which were added; the source listed only the horizontal-axis h and k for the parabola general equation, so the vertical-axis pair (h = -D/2A, k = (D^2 - 4AF)/(4AE)) was derived and added; the circle general-equation line 'A = C' was printed twice. In the problems: choice A of the perpendicular-line problem still prints a letter m (kept as printed), choice B of the circle-through-a-point problem prints sqrt(74) (kept), and the triangle-area choices 22, 11, 32, 35 look like they lost radicals but the answer 11 is unaffected.",
      "Removed the blur placeholder for Math Handout Day 7 (Day 7 left pendingContentMathHandouts, and the markPendingEmpty loop now skips Day 7). Version bump: 1.3.26.0 (minor) because a whole Handout day is now built (1.3.25.0 was taken by Handout Day 5, merged first). CRLF line endings preserved.",
      "v1.3.27.0: LAX uploaded 'Handouts_math_day_8.docx' (no answer key; 14 diagrams). Parsed the docx XML (OMML) and built Math Handout Day 8 as five sections: I. Ellipse, II. Hyperbola, III. Inclined Axis, IV. Polar Coordinates, V. Solid Geometry, with all 14 diagrams embedded as base64 images and 17 sample problems (each with the 4-hint system and a granular boxed solution). Solved everything from scratch since there was no key.",
      "Regrouped on purpose: the docx lists every problem under the last section, so each one was moved under the section it exercises (5 ellipse, 5 hyperbola, 2 discriminant tests, 4 polar, 1 solid geometry). Sample problems are numbered 1 to 17 in page order. Choices were kept where the docx printed them (4 problems); the rest are open-answer.",
      "Source issues fixed or disclosed: the ellipse shortcut 'a = sqrt(C), b = sqrt(A)' only works when the right side after completing the square equals AC, so the handout teaches the general rule R = D^2/4A + E^2/4C - F and says so; the hyperbola shortcut lines labelled 'a = -D/2A' are really h, so the center formulas were written out for both orientations; the point-to-plane distance had no absolute value bars and reused D for both the distance and the plane constant (now d with bars); the angle-between-vectors radicals were nested wrongly (fixed to a product of two roots); 'sin theta' had a missing '='; the conjugate axis line printed 2^a (fixed to 2a); the asymptote line only showed one orientation and one sign (now plus/minus with a note for the vertical axis).",
      "Problem source issues: r^2 = 1 - tan^2 lost its angle symbol (read as tan^2 theta, the only reading matching choice D); choice C of the focus problem printed '(0, n/2)' (read as (0, pi/2)); the polar-circle choices printed 'cosu' inside dollar signs (read as cos theta). Answers: ellipse 1 = center (2,-1), e = sqrt5/3; 2 = D; 3 = 6; 4 = x^2/64 + y^2/39 = 1; 5 = 1/2; hyperbola 1 = center (-2,3), e = sqrt5; 2 = (2,1); 3 = 18; 4 = x^2/16 - y^2/36 = 1; 5 = sqrt10/3; both discriminant tests = hyperbola; polar 1 = r = 8cos theta; 2 = D; 3 = D; 4 = A; solid = D (sqrt51).",
      "Removed the blur placeholder for Math Handout Day 8 (pendingContentMathHandouts is now [6] and the markPendingEmpty loop skips Days 7 and 8). Version bump: 1.3.27.0 (minor) because a whole Handout day is now built; file renamed to match (1.3.25.0 and 1.3.26.0 were taken by Handout Days 5 and 7, merged first). CRLF line endings preserved.",
      "v1.3.28.0: LAX uploaded 'Handouts_math_day_6.docx' (Geometry and Solid Mensuration, no answer key). Parsed the docx XML (OMML) and built Math Handout Day 6 as three sections: I. Polygon, II. Plane Areas, III. Volumes, with 32 concept cards of formulas, all 31 source figures embedded as base64 images, and 20 sample problems (8 polygon, 6 plane areas, 6 volumes) each with the 4-hint system and a granular boxed solution. Solved everything from scratch since there was no key.",
      "Answers: Polygon 1 D (3π/5), 2 N = 14, 3 pentagon 6.88 in² and circle 5.95 in², 4 259.81 cm², 5 ratio 1.0575, 6 D = 14.66 in, 7 A, 8 C; Plane Areas 1 A, 2 C, 3 363.69 m², 4 D, 5 C, 6 D; Volumes 1 A, 2 C, 3 depth 0.268 m and volume 2.174 m³, 4 452.39 cm³, 5 20 spheres, 6 C.",
      "Source issues disclosed on the page: the handout printed tan θ = x / r for the regular polygon (corrected to x / h from its own figure); the triangle inscribed in a circle had a figure but no formula (supplied A = abc / 4r); the cone formulas sat under the heading 'Spherical Segment' (moved to the Cone card); Plane Areas 1 computes 12.57 sq. m but choice A prints 12.75 (taken as a digit swap); Plane Areas 6 labels its area choices 'ft'; Polygon 6 (quadrilateral with an incircle) needs opposite sides to add equally (12 + 18 = 14 + 16) and a cyclic assumption to get the area, so it is solved that way and flagged; Polygon 3 and 6 and Volumes 3, 4, 5 have no choices.",
      "Wrote the page with a Python generator (helpers for cards, boxes, 4-tier problems) so the whole day came out in one consistent pass; the LaTeX was checked by compiling every one of the 514 snippets with mathjax-full, then audited with the section 1a greps (no bare slashes, no unwrapped boxes). The CDN MathJax could not load in the test browser, so the visual check covered layout and figures only.",
      "Removed the blur placeholder for Math Handout Day 6 (pendingContentMathHandouts is now empty and the markPendingEmpty loop now starts at Day 9). Version bump: 1.3.28.0 (minor) because a whole Handout day is now built; file renamed to match (1.3.25.0 to 1.3.27.0 were taken by Handout Days 5, 7 and 8, merged first).",
      "v1.3.29.0: LAX uploaded 'Sample_Problems_Math_Day_5.docx' (Arithmetic Progression, no answer key; the docx is titled DAY 5 - MATHEMATICS SAMPLE PROBLEMS, so it matches the Day 5 handout section). Parsed the docx XML (OMML) and built Math Sample Problems Day 5: 11 problems (finding terms, number of terms, sums) with the 4-hint system, a granular boxed solution each, and the 3 source figures (brick piles, pyramid) embedded as base64 images. Created the view-samples-math-5 container (it did not exist yet).",
      "Reused math5FormulaOutline from the Day 5 handout and expanded section I to three topics: Finding Terms, Number of Terms, Sum. Wired it with attachStaticTopicFilter.",
      "Source issues, disclosed: the docx ends at Problem 11 with no worked solution (solved from scratch, 920 seats); Problem 7's own solution gives n=81 but the printed choices stop at 80 m, so choice D was rewritten as 81 m and the page says so; Problem 1's choice D prints as '10' (kept as printed); garbled text in Problems 2, 4 and 8 repaired. All other answers re-derived and agree with the source steps.",
      "Removed the home blur for Math Sample Problems Day 5 (availableMathSampleProblems gets 5, pendingContentMathSampleProblems is now 6, 7, 8). Version bump: 1.3.29.0 (minor) because a whole Sample Problems day is now built; file renamed to match.",
      "v1.3.30.0: LAX uploaded 'Sample_Problems_Math_Day_6.docx' (14 multiple-choice problems titled 'DAY 6 - MATHEMATICS SAMPLE PROBLEMS', no answer key, so every problem was solved from scratch). Built Math Sample Problems Day 6 with the full hint system (problem type, formulas, variables, full step-by-step boxed solution) and the 3 source diagrams (hexagon in a circle, chord of a circle, two intersecting circles) embedded as base64 images. Created view-samples-math-6 (it did not exist yet) and the math6FormulaOutline (I. Polygon, II. Plane Areas, matching the Day 6 Handout headings) so the Day 6 Problem Set and Trivia can share and extend it; topic tags reuse the Handout Day 6 names where the same problem types appear.",
      "Answers: 1 A (18π), 2 A (108°), 3 D (n = 8), 4 B (54 diagonals), 5 B (259.81 ≈ 260 cm²), 6 B (120°), 7 C (140°), 8 B (12π in), 9 B (2.18 in), 10 D (4.74 m), 11 D (7.5π cm), 12 C (33.52 in), 13 B (43.30 cm), 14 C (22.80 cm).",
      "Source issues disclosed: the Problem 5 solution wrote the apothem as y = (10)² + 5², which only works as the square root of 10² − 5² (done that way here); Problem 10 started with 'or the triangle' (read as 'For the triangle'); Problem 11 says 'chord' where a wire or string is meant, and its choices carry π (the side is 7.5π cm ≈ 23.56 cm, matching choice D as printed); Problem 14 asks for the 'center between circles', read as the distance between the two centers; Problems 2 and 7 do not say 'regular', taken as regular since each interior angle is asked for.",
      "Removed the blur placeholder for Math Sample Problems Day 6 (pendingContentMathSampleProblems is now [7, 8] and availableMathSampleProblems gained 6). Version bump: 1.3.30.0 (minor) because a whole Sample Problems day is now built; file renamed to match (1.3.29.0 was taken by Sample Problems Day 5, merged first).",
      "v1.3.31.0: LAX uploaded 'Sample_Problems_Math_Day_7.docx' (titled 'DAY 7 - MATHEMATICS SAMPLE PROBLEMS', Analytic Geometry, so it matches the Day 7 Handout; only 9 problems, no answer key, so every problem was solved from scratch). No pandoc in the container, so the docx was unzipped and its XML parsed with a small script (including the Word equations). Built Math Sample Problems Day 7 with the full hint system, boxed given/step chains and the 5 source figures embedded as base64.",
      "Answers: 1 C (6), 2 A (2, 21.5), 3 A (7/2), 4 D (45), 5 B (−5/2), 6 A (x = −11), 7 A (5, 0), 8 D (0, −4), 9 C (y = −5x + 20).",
      "Source issues disclosed: the Problem 3 figure labels C as (1, −3) but the text and the source solution use C(1, 3) (answer 7/2; C(1, −3) would give 17/2, not a choice); Problem 4's source drops the absolute-value bars in the last step (answer unchanged); Problem 8's source middle step reads 3y = 12 instead of −3y = 12 (y = −4 is still right) and choices B and C are not on the y-axis; Problem 9's title lost its first letter ('ind') and its solution was cut off, so it was solved from scratch.",
      "Added math7FormulaOutline (sections match the Day 7 Handout: I. Cartesian Coordinate System, II. Straight Line, III. Properties of Lines) wired through attachStaticTopicFilter so the Practice by formula filter works; the later Day 7 Problem Set and Trivia should share and extend it. Created the missing view-samples-math-7 container, added 7 to availableMathSampleProblems and removed it from pendingContentMathSampleProblems (now [8]) so the home tile is no longer blurred. Version bump: 1.3.31.0 (minor) because a whole Sample Problems day is now built; file renamed to match. Rebased onto Day 6 (v1.3.30.0), which had merged first.",
      "v1.3.32.0: LAX uploaded 'Sample_Problems_Math_Day_8.docx' (titled 'DAY 8 - MATHEMATICS SAMPLE PROBLEMS', 8 ellipse problems, so it matches section I. Ellipse of the Day 8 Handout; no answer key, so every problem was solved from scratch). Parsed the docx XML (OMML) with a small script and built Math Sample Problems Day 8 with the full hint system, boxed given/step chains and the 3 source diagrams (ellipse with vertices and foci, ellipse with minor axis 3, semi-elliptical arch) embedded as base64 images inside each full solution.",
      "Created view-samples-math-8 (it did not exist) and math8FormulaOutline (I. Ellipse, 8 topics) so the Day 8 Problem Set and Trivia can share and extend it, wired with attachStaticTopicFilter. Long-box rule applied: every box is a single short equation or a 2 to 4 cell grid, nothing needed a full-row override.",
      "Answers: 1 D (17.32), 2 C (6.93), 3 C (1/2), 4 A (2), 5 A (x²/45 + y²/49 = 1), 6 D (4x²/9 + y²/25 = 1), 7 D (9.17 ft), 8 C (-2, 3). All agree with the source steps.",
      "Source issues disclosed: Problem 2 choice B printed '8.193' (read as a typo, rewritten as 8.93) and the solution says 'By instegration' (read as 'By inspection'); Problem 4 had two choices printed as 6, so choice D was rewritten as 8; Problem 5's solution wrote b² = a² ⋅ c² where it means a² − c² (read as a minus: 7² − 2² = 45); Problem 6's solution jumped from x²/9 to 4x²/9 without the dividing-by-9/4 step, which was added; Problem 3 and 4 focal radii wording follows the source (sum of the two focal radii = 2a).",
      "Removed the home blur for Math Sample Problems Day 8 (pendingContentMathSampleProblems is now empty and availableMathSampleProblems gained 8). Version bump: 1.3.32.0 (minor) because a whole Sample Problems day is now built; file renamed to match (1.3.31.0 was taken by Sample Problems Day 7, merged first).",
      "v1.3.33.0: LAX pasted Math Trivia Day 4 (15 questions plus answer key) in chat. Built trivia4Data wired to quiz-4 with the 4-tier hint system, shares math4FormulaOutline (added a Median topic under Statistics and Series). Solved every item independently: all 15 match the key (1.B 2.A 3.C 4.D 5.C 6.A 7.B 8.D 9.A 10.B 11.C 12.C 13.C 14.D 15.A). Disclosed: Q2 uses the population standard deviation (divide by n; sample would give 3.50, not a choice), and Q9 choice A was printed 5,246,786 but C(42,6) = 5,245,786, so the choice was corrected",
      "Removed the old Trivia Day 4 placeholder loop (it would have blurred and overwritten the quiz) and cleared pendingContentTriviaDays so the home tile is no longer blurred; the data block sits after Trivia Day 3 so math4FormulaOutline is declared first. Version 1.3.33.0 (minor, a Trivia set completed), file renamed, changelog and CLAUDE.md updated",
      "v1.3.33.1: LAX asked to fix the Practice by formula filter for Math Day 5 to Day 8 Problem Set and Trivia. These 8 quizzes (day5Data..day8Data, ps5Data..ps8Data, 15/50/15/46/15/52/15/50 questions) already existed from the older upload but had no topics and no outline passed to renderQuiz, so no filter showed. Tagged every question with a topics array, extended math5..math8FormulaOutline with the new topics (sections match each Handout h2; extra groups added for questions outside the handout headings, e.g. XIV General Algebra Applications, IV Distance Applications, VI Other Conics and Space Coordinates, VI General Conic Sections), and passed the outline as the 5th renderQuiz argument. Moved the four outline consts to just before day7Data because the old locations were declared after the quizzes that now use them. Verified with node --check, CSS brace balance and a jsdom render of all 8 views (question counts and filter panel present). Version bump: 1.3.33.1 (patch)",
      "v1.3.34.0: LAX asked for a fifth column, Missed Questions Compilation Day N, and pasted the missed-question reports of several students (about 40 items, many repeated) for Math Day 1 to 4. Deduplicated to 23 unique questions and filed each under the Math day whose topic it matches: Day 1 (9, equations, quadratics, functions, remainder), Day 2 (5, number and work problems, consecutive integers), Day 3 (8, man-hours, profit and loss, quadratic and investment word problems, equilateral triangle) and Day 4 (1, binomial probability). Where students gave different wrong picks for the same question the letters were merged; choices with no record are left as blank strings, per LAX.",
      "Built it like the other four columns: home grid and header went from 4 to 5 columns (grid-5, col-headers-5), new availableMathMissed list, a missed entry in SUBJECT_CONFIG for math (PPE and MD get a permanently blurred placeholder so the grid stays aligned), views view-missed-1 to 4 with quiz-missed-N, data missed1..4Data wired to math1..4FormulaOutline (new topics added there). Days 5 to 12 show blurred and disabled. Every item has the 4-tier hint system with a boxed step-by-step solution. OCR repairs: x2 as x squared, iv2 as i root 2, O as 0, 1% as one half, Y4 as one quarter.",
      "Solved all 23 independently. 21 match LAX's stated correct answer. Two do not and are flagged inside the solution hint, still using LAX's answer: the calculator question (the printed text gives P228.57, not P286.45) and the point outside the equilateral triangle (19.60 is the root where the point is inside; a truly outside point gives 6.37). Also noted: choice A of the (x-3)^2+8 question was garbled in the paste and rebuilt, the Cris/Alan question only records the choice 16 (Cris's amount), and P1.428 is a rounded 10/7. Version 1.3.34.0 (minor, a new feature column).",
      "v1.3.35.0: LAX sent the Missed Questions batch for Math Day 5 to 8 (about 45 reports, many repeated). Deduplicated to 26 unique questions and filed by topic: Day 5 (3: angle bisector length, sine-ratio perimeter, 30-60-90 find c), Day 6 (12: sphere water level, balls in a jar, hemispherical bowl, glass bowl, sphere diameter, frustum, sphere in cube, two sector-to-cone items, sphere equals cone, goat, triangle area with altitude), Day 7 (8: slope, side lengths, five circle items, intercept line) and Day 8 (3: moon orbit, conic type, hyperbola foci). Same build as v1.3.34.0: missed5..8Data, view-missed-5..8, availableMathMissed extended, new topics added to the math5..8 outlines.",
      "Judgement call: the two coordinate-geometry items (slope of a triangle side, side of length root 50) were tagged Trigonometry - Sine and Cosine Law in the reports, but they are distance/slope work, so they went to Day 7 (Cartesian coordinates and Straight Line) rather than Day 5.",
      "Solved all 26 independently. Disagreements with LAX's stated answers, all disclosed in the solution and still using LAX's answer: hemispherical bowl percentage (working gives 51.85, key 45.61), glass bowl escaped water (key equals the volume between depth 3 and depth 2; read literally it is 73.30), the root-50 sides (they are AC and BC, key says AB and BC), the two-balls-in-a-jar item (figure missing, key matches a water height of 8 in), the internally tangent circles item (key is the tangent length from the larger center, wording incomplete). Also noted: the x-intercept 2 / y-intercept 3 line has choices A and B that are the same equation, one student's pick was recorded as an unreadable X (left blank), and the ring question was cut off after Find the area of. Version 1.3.35.0 (minor, the Missed Questions column now covers Day 1 to 8).",
      "v1.3.36.0: LAX sent the Missed Questions batch for Math Day 9 to 12 (about 55 reports, many repeated). Deduplicated to 31 unique questions: Day 9 (7: product/chain rule derivative, implicit differentiation x2, tangent parallel to a line, normal line, relative minimum, tangent line), Day 10 (13: maxima and minima x8 including marginal cost, time rates x4, particular solution of y' = 4x), Day 11 (1: slope from parametric equations) and Day 12 (10: compound interest, effective and nominal rates). Missed Questions now covers Math Day 1 to 12, so the column has no blurred Math days left (PPE and MD still show blurred placeholders).",
      "Placement judgement calls, by the Day 9 to 12 outlines: the differential equation from y^2 = 4ax went to Day 9 (it is solved by implicit differentiation, and its report category was Derivatives); the parametric slope went to Day 11 because that outline has Parametric Differentiation; y' = 4x with y(1) = 3 went to Day 10 (Integral Calculus, constant of integration); marginal cost went to Day 10 with the maxima and minima items it was reported under. Added two topics to the Day 10 outline (Maxima and Minima (Marginal Cost), Time Rate (Trough)).",
      "Solved all 31 independently; 30 match LAX's stated answer. The mismatch: the tangent line to y = 2x^2 - x at (1, 0): that point is not on the curve (y(1) = 1); the key 3x - y = 3 is the slope-3 line through (1, 0), the true tangent at (1, 1) is 3x - y = 2. Flagged in the solution and kept LAX's answer. Loose wording flagged in the hints: 'greater to its square by a minimum difference' (x - x^2 is maximal at 1/2) and 'maximum value of x' for y = 2x^2 - 8x + 3 (x = 2 is the minimum point). The x^2 + 2xy + y^2 = 9x^2 derivative uses the positive branch (answer 2; the other branch gives -4). Version 1.3.36.0 (minor, the column now spans Math Day 1 to 12).",
      "v1.3.36.1: LAX asked for the home page title to read \"ME Boards Practice Hub vX.X.X.X\" above \"Choose a day or problem set to begin\". Added a span in the home h1 filled at load from CHANGELOG[0].version (same source as the Changelog view), so it follows every future version bump with no hand edit."
    ]
  },

    body: [
      "v1.3.51.0: LAX asked for a feature that trains how to identify a problem type, going deeper than Hint 1. Brainstormed 7 ideas, LAX agreed to the Identify Drill plus the Keyword Cheat Sheet, scoped to Math Day 14 to 16 first.",
      "Both are built lazily from the existing trivia14..16Data and ps14..16Data (topics[0] plus the Hint 1 kw-map), so no question data was duplicated or changed. 207 usable questions (Day 14: 59, Day 15: 75, Day 16: 73).",
      "Drill: shows the question through appendQuestionContent, 4 topic choices (distractors from the same day, look-alike toggle prefers the same outline section), reveals the Hint 1 kw-map after the pick. Missed topics are counted in localStorage (try/catch). Cheat sheet: kw-rows grouped by topic in outline order, with a search box. Both call MathJax.typesetPromise on their own container after building, since they build DOM outside showView.",
      "Extending to other days: add an entry to IDT_DAYS and the day chips in idtDayChips.",

      "Formula Builder (fbOpen/fbRun): per question, step 1 pick the formula from 4 (Hint 2 fr-center, decoys from other topics of the same day, look-alike toggle prefers the same outline section); step 2 tap the givens used (Hint 3 hint-formula split on the comma-backslash-space separator, 3 decoy givens from other questions with different symbols); step 3 answer with the real choices, then Hint 4 is revealed. Formula picker filters by topic; 3 perfect questions in a row (no wrong tap at any step) sets mastered, stored in localStorage fbMastery with try/catch. All 207 Day 14-16 questions have a Hint 2 formula and Hint 3 givens, so no data was added.",
